name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: country_flags
          POSTGRES_USER: country_flags
          POSTGRES_PASSWORD: country_flags
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U country_flags -d country_flags"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://country_flags:country_flags@localhost:5432/country_flags?schema=public
      CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Generate Prisma client
        run: corepack yarn prisma:generate

      - name: Validate Prisma schema
        run: corepack yarn prisma:validate

      - name: Apply database migrations
        run: corepack yarn prisma:migrate:deploy

      - name: Validate API and JSON Schema contracts
        run: corepack yarn contracts:check

      - name: Check formatting
        run: corepack yarn format:check

      - name: Lint
        run: corepack yarn lint

      - name: Typecheck
        run: corepack yarn typecheck

      - name: Test
        run: corepack yarn test:ci

      - name: Build
        run: corepack yarn build

      - name: Build production image
        run: corepack yarn docker:build
