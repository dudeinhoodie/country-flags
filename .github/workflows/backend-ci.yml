name: Backend CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: country_flags
          POSTGRES_USER: country_flags
          POSTGRES_PASSWORD: country_flags
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U country_flags -d country_flags"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://country_flags:country_flags@localhost:5432/country_flags?schema=public
      CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Generate Prisma client
        run: corepack yarn prisma:generate

      - name: Validate Prisma schema
        run: corepack yarn prisma:validate

      - name: Apply database migrations
        run: corepack yarn prisma:migrate:deploy

      - name: Validate API and JSON Schema contracts
        run: corepack yarn contracts:check

      - name: Check formatting
        run: corepack yarn format:check

      - name: Lint
        run: corepack yarn lint

      - name: Typecheck
        run: corepack yarn typecheck

      - name: Test
        run: corepack yarn test:ci

      - name: Rebuild deterministic content fixture
        run: >-
          corepack yarn content build
          --catalog-version fixture-v1
          --publish-ready

      - name: Check generated content diff
        run: |
          git diff --exit-code -- content/generated/fixture-v1
          test -z "$(git status --porcelain --untracked-files=all -- content/generated/fixture-v1)"

      - name: Build
        run: corepack yarn build

      - name: Build production image
        run: corepack yarn docker:build

      - name: Scan production image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: country-flags-backend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Container smoke test (non-root, health endpoint)
        run: |
          docker run -d --name backend-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=production -e PORT=3000 \
            -e AUTH_ACCESS_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e AUTH_ACCESS_TOKEN_ISSUER=ci -e AUTH_ACCESS_TOKEN_AUDIENCE=ci \
            -e AUTH_RATE_LIMIT_SECRET="$(openssl rand -hex 32)" \
            -e ACCOUNT_DATA_HASH_SECRET="$(openssl rand -hex 32)" \
            -e PUBLIC_BASE_URL=http://localhost:3000 \
            -e APPLE_CLIENT_IDS=ci -e GOOGLE_CLIENT_IDS=ci \
            -e CORS_ALLOWED_ORIGINS=http://localhost \
            country-flags-backend:local

          actual_user="$(docker exec backend-smoke whoami)"
          if [ "$actual_user" != "node" ]; then
            echo "Container is not running as the non-root 'node' user (got: $actual_user)" >&2
            docker logs backend-smoke || true
            exit 1
          fi

          ready=""
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/v1/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "Container never became healthy" >&2
            docker logs backend-smoke || true
            exit 1
          fi
          curl -fsS http://localhost:3000/v1/health/live
          curl -fsS http://localhost:3000/v1/health/ready

      - name: Stop smoke test container
        if: always()
        run: docker rm -f backend-smoke || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Dependency audit
        run: corepack yarn npm audit --severity high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
