name: Content source refresh

on:
  workflow_dispatch:
    inputs:
      source:
        description: Pinned source to refresh
        required: true
        type: choice
        options:
          - all
          - cldr
          - un-m49
          - annexare
          - world-bank
          - wikidata
          - flag-icons
          - editorial
      revision:
        description: Expected pinned revision (empty uses registry revision)
        required: false
        type: string
  schedule:
    - cron: "17 4 1 */3 *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-source-refresh-${{ inputs.source || 'all' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTENT_SOURCE: ${{ inputs.source || 'all' }}
      CONTENT_REVISION: ${{ inputs.revision }}
      CONTENT_VERSION: refresh-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Enforce upstream host allowlist
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sourceKey = process.env.CONTENT_SOURCE;
            const registry = JSON.parse(readFileSync("tools/content-pipeline/sources/registry.json", "utf8"));
            const allowed = new Set([
              "api.worldbank.org",
              "api.github.com",
              "github.com",
              "query.wikidata.org",
              "raw.githubusercontent.com",
              "unstats.un.org"
            ]);
            const sources = sourceKey === "all"
              ? registry.sources
              : registry.sources.filter(({ key }) => key === sourceKey);
            if (sources.length === 0) throw new Error(`Unknown source ${sourceKey}`);
            for (const source of sources) {
              if (source.url.startsWith("file:")) continue;
              const host = new URL(source.url).hostname;
              if (!allowed.has(host)) throw new Error(`Host ${host} is not allowlisted`);
            }
          '

      - name: Pull pinned source
        run: |
          args=(pull --update-registry)
          if [ "$CONTENT_SOURCE" != "all" ]; then
            args+=(--source "$CONTENT_SOURCE")
          fi
          if [ -n "$CONTENT_REVISION" ]; then
            if [ "$CONTENT_SOURCE" = "all" ]; then
              echo "revision is only valid for one concrete source" >&2
              exit 2
            fi
            args+=(--version "$CONTENT_REVISION")
          fi
          corepack yarn content "${args[@]}" 2>&1 | tee content-source-pull.log

      - name: Build and validate candidate
        run: |
          corepack yarn content build --catalog-version "$CONTENT_VERSION"
          corepack yarn content validate --version "$CONTENT_VERSION"
          corepack yarn content report --version "$CONTENT_VERSION" > content-refresh-report.json

      - name: Compare with committed fixture
        run: >-
          corepack yarn content diff
          --version "$CONTENT_VERSION"
          --against fixture-v1
          > content-refresh-diff.json

      - name: Run offline quality gates
        run: |
          corepack yarn workspace @country-flags/content-pipeline test
          corepack yarn content build --catalog-version fixture-v1 --publish-ready

      - name: Detect meaningful changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- tools/content-pipeline/sources tools/content-pipeline/editorial content/generated/fixture-v1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create refresh commit
        if: steps.changes.outputs.changed == 'true'
        env:
          REFRESH_BRANCH: automation/content-refresh-${{ env.CONTENT_SOURCE }}-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$REFRESH_BRANCH"
          git add tools/content-pipeline/sources tools/content-pipeline/editorial content/generated/fixture-v1
          git commit -m "chore(content): refresh $CONTENT_SOURCE"
          git push --set-upstream origin "$REFRESH_BRANCH"
          {
            echo "## Content source refresh"
            echo
            echo "- Source: \`$CONTENT_SOURCE\`"
            echo "- Revision: \`${CONTENT_REVISION:-registry pin}\`"
            echo
            echo "### Catalog diff"
            echo
            echo '```json'
            cat content-refresh-diff.json
            echo '```'
            echo
            echo "### Reports"
            echo
            echo '```json'
            cat content-refresh-report.json
            echo '```'
            echo
            echo "Generated by the source-refresh workflow. It does not publish production content."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --draft \
            --base "$GITHUB_REF_NAME" \
            --head "$REFRESH_BRANCH" \
            --title "chore(content): refresh $CONTENT_SOURCE" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-refresh-${{ env.CONTENT_SOURCE }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            content-refresh-diff.json
            content-refresh-report.json
            content-source-pull.log
            content/generated/refresh-*
