name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      # The app bundles the flags of a pinned content release, so republishing
      # that release can make the committed set stale.
      - "content/generated/**"
      # The bundled client contract is mirrored into the package, and the
      # mirror check only helps if it runs when the contract moves — a stale
      # mirror once merged unnoticed because this filter skipped contracts.
      - "contracts/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "ios/**"
      - "content/generated/**"
      - "contracts/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  build-and-test:
    # macos-26 carries Xcode 26, whose SDK the app now genuinely needs:
    # the liquid-glass APIs the UI is built on do not exist in Xcode 16.
    runs-on: macos-26
    # Headroom, not a target. The job builds the app three times over — Mock
    # with the UI tests, Dev, and the unsigned archive — on top of the package
    # suite, and that costs 37 to 41 minutes on a good runner. At 45 a slow
    # one tips over and a branch fails for having been unlucky, which is worse
    # than useless: it teaches everyone to rerun red without reading it.
    #
    # The cost is real and worth attacking at the source — three full builds
    # is the thing to remove, not the ceiling to keep raising.
    timeout-minutes: 70

    env:
      PROJECT: CountryFlags.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Swift 6 language mode needs Xcode 16 or newer. The exact version is
      # printed so a mismatch with a local machine is visible.
      - name: Select Xcode
        run: |
          set -euo pipefail
          minimum=26
          # The xcodebuild output is read in full: closing the pipe early
          # (`| head`) kills it with SIGPIPE and exit code 134.
          version_output="$(xcodebuild -version)"
          selected="$(printf '%s\n' "${version_output}" | sed -n '1p')"
          major="$(printf '%s\n' "${selected}" | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [[ "${major}" -lt "${minimum}" ]]; then
            echo "::error::${selected} is older than the required Xcode ${minimum}"
            exit 1
          fi
          echo "${selected}"
          swift --version

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        working-directory: ${{ github.workspace }}
        run: |
          corepack enable
          corepack yarn install --immutable

      # The generated client is built from the committed mirror, so a mirror
      # that drifted from contracts/openapi.yaml would silently ship an old
      # contract to the app.
      - name: Check the contract mirror
        run: ./Scripts/sync-openapi.sh --check

      # The bundled flags are generated from one content release rather than
      # hand-maintained, so a committed set that drifted from it would ship
      # images no release ever published.
      - name: Check the bundled flag set
        run: node Scripts/sync-flag-assets.mjs --check

      # The Mock build serves a projection of the same release rather than a
      # second, hand-written catalogue, and a projection that drifted from it
      # would be exactly the hand-written catalogue again.
      - name: Check the mock content
        run: node Scripts/sync-mock-content.mjs --check

      # Advertising is off in the MVP: no ad SDK, no advertising identifier and
      # no tracking prompt may enter the app target. The unit tests can only
      # prove the package stays clean, not the app target, so it is checked
      # here.
      - name: Check the advertising policy
        run: ./Scripts/check-advertising-policy.sh

      # Sign in with Apple is the only door into a Prod build, and it needs an
      # entitlement to open. The archive below is unsigned, so it carries no
      # entitlements to read — the project and the file are what can be
      # checked, and losing either is how the door was found shut.
      - name: Check the signing entitlements
        run: ./Scripts/check-signing-entitlements.sh

      # The device depends on the runner image, so it is picked from a
      # preference list and printed to the log.
      - name: Select simulator
        id: simulator
        run: echo "destination=$(./Scripts/select-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: xcodebuild -project "${PROJECT}" -resolvePackageDependencies

      # A package test target cannot join the test action of a host project
      # scheme, so the unit tests run through the scheme of the package itself.
      - name: Test CountryFlagsKit
        working-directory: ios/CountryFlagsKit
        run: |
          set -o pipefail
          xcodebuild \
            -scheme CountryFlagsKit-Package \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -skipPackagePluginValidation \
            -resultBundlePath ../build/CountryFlagsKit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      # A guest smoke rather than the whole suite: the launch, the catalogue,
      # a session answered end to end and the sync line. The rest of the suite
      # runs nightly — thirty-five minutes is too long to hold a review, and a
      # check nobody waits for is a check nobody reads.
      - name: Build and smoke-test Mock
        run: |
          set -o pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme CountryFlags-Mock \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -skipPackagePluginValidation \
            -only-testing:CountryFlagsUITests/LaunchSmokeUITests \
            -only-testing:CountryFlagsUITests/StudySessionUITests \
            -only-testing:CountryFlagsUITests/SyncStatusUITests \
            -resultBundlePath build/CountryFlags-Mock.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Dev is built but not tested: it shares the code base and differs only
      # in the backend endpoint, which this work package does not use yet.
      - name: Build Dev
        run: |
          set -o pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme CountryFlags-Dev \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -skipPackagePluginValidation \
            -resultBundlePath build/CountryFlags-Dev.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The build that would go to the store, and what it carries. Unsigned,
      # because a pull request has no business holding a signing identity —
      # what is being proved here is that the release configuration compiles,
      # archives, and contains no debug affordance.
      - name: Archive the release build, unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme CountryFlags-Prod \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -archivePath build/CountryFlags.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Check what the release build carries
        run: ./Scripts/check-release-app.sh build/CountryFlags.xcarchive/Products/Applications/CountryFlags.app

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}
          path: ios/build/*.xcresult
          retention-days: 7
          if-no-files-found: warn
