name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROJECT: CountryFlags.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Swift 6 language mode требует Xcode 16 или новее. Точная версия
      # печатается в лог, чтобы расхождение с локальной машиной было видно.
      - name: Select Xcode
        run: |
          set -euo pipefail
          minimum=16
          selected="$(xcodebuild -version | head -1)"
          major="$(echo "${selected}" | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [[ "${major}" -lt "${minimum}" ]]; then
            echo "::error::${selected} is older than the required Xcode ${minimum}"
            exit 1
          fi
          echo "${selected}"
          swift --version

      # Устройство зависит от образа раннера, поэтому выбирается из списка
      # предпочтений и печатается в лог.
      - name: Select simulator
        id: simulator
        run: echo "destination=$(./Scripts/select-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: xcodebuild -project "${PROJECT}" -resolvePackageDependencies

      - name: Build and test Mock
        run: |
          set -o pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme CountryFlags-Mock \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath build/CountryFlags-Mock.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Dev собирается, но не тестируется: у него та же кодовая база и другой
      # только backend endpoint, который в этой задаче ещё не используется.
      - name: Build Dev
        run: |
          set -o pipefail
          xcodebuild \
            -project "${PROJECT}" \
            -scheme CountryFlags-Dev \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath build/CountryFlags-Dev.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}
          path: ios/build/*.xcresult
          retention-days: 7
          if-no-files-found: warn
