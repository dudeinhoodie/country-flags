name: Backup restore drill

on:
  workflow_dispatch:
  schedule:
    # Monthly, off-peak UTC — proves the restore procedure still works (docs/10-backup-restore-runbook.md
    # requires this quarterly at minimum). Intentionally NOT on pull_request/push: this is a
    # standing-infrastructure check, not a per-PR gate.
    - cron: "31 3 1 * *"

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: country_flags
          POSTGRES_USER: country_flags
          POSTGRES_PASSWORD: country_flags
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U country_flags -d country_flags"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://country_flags:country_flags@localhost:5432/country_flags?schema=public
      # The schema's `directUrl` is a separate variable, and Prisma reads it
      # while validating the schema — before it ever opens a connection. The
      # drill's Postgres is the same server either way; there is no pooler in
      # front of a container that lives for one job.
      DIRECT_DATABASE_URL: postgresql://country_flags:country_flags@localhost:5432/country_flags?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Generate Prisma client
        run: corepack yarn prisma:generate

      - name: Apply database migrations
        run: corepack yarn prisma:migrate:deploy

      - name: Seed representative data
        run: corepack yarn content:import:test

      - name: Run restore drill
        run: bash backend/scripts/db-backup-restore-drill.sh

      # There is no cloud alert for this: the drill holds no credentials and
      # writes nothing outside the job, so the only notification is GitHub's own
      # mail on a failed scheduled run. That mail names the workflow and nothing
      # else, so the summary is where the reader finds out what a failure means
      # and where to go next.
      #
      # Sanitized by construction — it reports the outcome and a document path,
      # never a dump, a row or a connection string (spec section 16).
      - name: Summarise the drill
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Restore drill"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${RESULT}\` |"
            echo "| Scope | throwaway PostgreSQL inside this job |"
            echo "| Production data touched | none |"
            echo
            if [ "${RESULT}" = "success" ]; then
              echo "The restore procedure still works. Next drill: next month's schedule."
            else
              echo "**The restore procedure is unproven until this passes.** No backup is"
              echo "lost — this drill restores into a throwaway database and holds no"
              echo "credentials — but the RTO target in docs/10-backup-restore-runbook.md"
              echo "is not evidence-backed while it fails."
              echo
              echo "Triage: docs/ops/deployment-runbooks.md, \"A backup or restore drill failed\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
