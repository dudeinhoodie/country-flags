name: Deploy site dev

# Hangs off a successful Site CI run on master rather than off the push:
# chaining on the push would race the image publish and deploy a tag that
# does not exist yet. Deploying the site and publishing a document stay two
# separate actions: the page is one immutable image, the documents are a
# snapshot the console writes into the bucket the page reads.
on:
  workflow_run:
    workflows: ["Site CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA already published to GHCR
        required: true

permissions:
  contents: read
  id-token: write
  packages: read
  deployments: write

env:
  PROJECT_ID: speedy-web-235610
  PROJECT_NUMBER: "337239833704"
  REGION: europe-west3
  SERVICE: site-dev
  REPOSITORY: country-flags
  SOURCE_IMAGE: ghcr.io/dudeinhoodie/country-flags-site
  # Where the console's publish lands (docs/13 §6.4). The page reads it
  # same-origin through nginx, so the browser never sees the bucket.
  DOCUMENTS_UPSTREAM: https://storage.googleapis.com/country-flags-site-dev/documents

concurrency:
  group: deploy-site-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve the commit
        id: commit
        run: |
          set -euo pipefail
          sha="${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run serves images from Artifact Registry, so the published
      # image is copied rather than rebuilt: rebuilding would deploy bytes
      # CI never tested.
      - name: Copy the site image into Artifact Registry
        id: image
        run: |
          set -euo pipefail
          target="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/site"
          tag="sha-${{ steps.commit.outputs.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${SOURCE_IMAGE}:${tag}"
          docker tag "${SOURCE_IMAGE}:${tag}" "${target}:${tag}"
          docker push "${target}:${tag}"
          digest="$(gcloud artifacts docker images describe "${target}:${tag}" --format='value(image_summary.digest)')"
          echo "reference=${target}@${digest}" >> "$GITHUB_OUTPUT"

      # Unlike the console, the site needs no one-time provisioning beyond
      # its runtime identity: a missing service is created by the deploy
      # below, so the first run is the same run as every other.
      - name: Note the revision serving now
        id: before
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "${SERVICE}" --region "${REGION}" \
            --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          if [ -z "${revision}" ]; then
            echo "The service does not exist yet; this deploy creates it."
          else
            echo "Serving ${revision} before this deploy"
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # Opened before the revision changes rather than after it works, so a
      # deploy that fails leaves a record saying so.
      - name: Open the deployment record
        id: record
        uses: actions/github-script@v9
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ steps.commit.outputs.sha }}',
              environment: 'dev',
              auto_merge: false,
              required_contexts: [],
              description: 'Cloud Run site-dev',
              payload: {
                service: 'site-dev',
                region: '${{ env.REGION }}',
                image: '${{ steps.image.outputs.reference }}',
              },
            });
            core.setOutput('id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying the revision',
            });

      # The whole configuration is set on every deploy rather than updated
      # in place, so what the service runs with is readable here instead of
      # being whatever a console session last left on it. Public by design:
      # this is the address the app's legal links point at, and a reader
      # who taps them has no Google identity to present.
      - name: Deploy the revision
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --region "${REGION}" \
            --image "${{ steps.image.outputs.reference }}" \
            --service-account "site-dev-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 256Mi \
            --labels "release=${{ steps.commit.outputs.sha }},deployment-env=dev,managed-by=github-actions" \
            --set-env-vars "^;^SITE_ENVIRONMENT=dev;SITE_DOCUMENTS_UPSTREAM=${DOCUMENTS_UPSTREAM};SITE_APP_VERSION=${{ steps.commit.outputs.sha }}" \
            --quiet
          revision="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.latestCreatedRevisionName)')"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Serving ${revision}"

      - name: Resolve the site address
        id: service
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')"
          if [ -z "${url}" ]; then
            echo "::error::Cloud Run service ${SERVICE} has no address after the deploy"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Deployed is not the same as working: a revision that cannot serve
      # its own runtime config, or that answers a blank page, would be
      # reported green otherwise.
      - name: Smoke-test the revision
        id: smoke
        run: |
          set -euo pipefail
          url="${{ steps.service.outputs.url }}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${url}/config.json" | tee /tmp/config.json; then
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "::error::${url}/config.json never answered"
              exit 1
            fi
            sleep 5
          done
          # An image that reports the wrong environment is the one mistake
          # this whole runtime-config design exists to prevent.
          grep -q '"environment": "dev"' /tmp/config.json

          curl --fail --silent --show-error "${url}/" -o /tmp/index.html
          grep -q '<title>Country Flags' /tmp/index.html

          # 404 is a site with nothing published yet, which is a working site
          # rather than a broken one; anything else is the proxy failing.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "${url}/documents/index.json" || true)"
          case "${code}" in
            200|404) echo "Documents answered ${code}" ;;
            *)
              echo "::error::${url}/documents/index.json answered ${code}"
              exit 1 ;;
          esac

      - name: Roll back on failure
        if: failure() && steps.before.outputs.revision != ''
        run: |
          set -euo pipefail
          previous="${{ steps.before.outputs.revision }}"
          echo "Routing traffic back to ${previous}"
          gcloud run services update-traffic "${SERVICE}" --region "${REGION}" \
            --to-revisions "${previous}=100" --quiet

      - name: Record the deployment result
        if: always() && steps.record.outputs.id != ''
        uses: actions/github-script@v9
        env:
          DEPLOY_RESULT: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.DEPLOY_RESULT === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.record.outputs.id }},
              state: succeeded ? 'success' : 'failure',
              environment_url: '${{ steps.service.outputs.url }}',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: succeeded
                ? 'Serving and smoke tested'
                : 'Deploy did not reach a smoke-tested revision',
            });

      - name: Summarise the deployment
        if: always() && steps.commit.outputs.sha != ''
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          IMAGE: ${{ steps.image.outputs.reference }}
          REVISION: ${{ steps.deploy.outputs.revision }}
          URL: ${{ steps.service.outputs.url }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Site dev deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Result | \`${RESULT}\` |"
            echo "| Release | \`${SHA}\` |"
            echo "| Environment | \`dev\` |"
            echo "| Cloud Run revision | \`${REVISION:-not created}\` |"
            echo "| Image | \`${IMAGE:-not resolved}\` |"
            echo "| Site URL | ${URL:-unknown} |"
            echo "| Documents | ${DOCUMENTS_UPSTREAM} |"
          } >> "$GITHUB_STEP_SUMMARY"
