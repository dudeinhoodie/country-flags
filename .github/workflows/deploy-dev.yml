name: Deploy dev

# A successful master build is what produces the image, so the deploy hangs off
# that run rather than off the push: chaining on the push would race the
# publish and deploy a tag that does not exist yet.
on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [master]
    types: [completed]
  # Redeploying the same image is how a bad revision is recovered from without
  # rebuilding anything.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA already published to GHCR
        required: true

permissions:
  contents: read
  # The federated credential is minted per run; no key exists to leak.
  id-token: write
  packages: read
  deployments: write

env:
  PROJECT_ID: speedy-web-235610
  PROJECT_NUMBER: "337239833704"
  REGION: europe-west3
  SERVICE: api-dev
  REPOSITORY: country-flags
  SOURCE_IMAGE: ghcr.io/dudeinhoodie/country-flags-backend

concurrency:
  # A second deploy waits rather than cancels: cancelling one mid-migration
  # would leave the database ahead of every running revision.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # A failed build has nothing worth deploying, and a manual run has no
    # upstream conclusion to read.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve the commit
        id: commit
        run: |
          set -euo pipefail
          sha="${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${sha}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run serves images from Artifact Registry rather than from an
      # arbitrary registry, so the published image is copied rather than
      # rebuilt: rebuilding would deploy bytes CI never tested.
      - name: Copy the release image into Artifact Registry
        id: image
        run: |
          set -euo pipefail
          target="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api"
          tag="sha-${{ steps.commit.outputs.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${SOURCE_IMAGE}:${tag}"
          docker tag "${SOURCE_IMAGE}:${tag}" "${target}:${tag}"
          docker push "${target}:${tag}"
          # The digest is what the revision pins: a tag can be moved, a digest
          # cannot, and "redeploy the same image" has to mean the same bytes.
          digest="$(gcloud artifacts docker images describe "${target}:${tag}" --format='value(image_summary.digest)')"
          echo "reference=${target}@${digest}" >> "$GITHUB_OUTPUT"

      - name: TEMPORARY probe of the current service configuration
        run: |
          set -euo pipefail
          # The spec holds credentials as references rather than values, so the
          # only values printed here are the public ones.
          gcloud run services describe "${SERVICE}" --region "${REGION}" \
            --format='yaml(spec.template.spec.containers[0].env)' || true
          echo "::error::probe only"
          exit 1

      - name: Read the database credentials
        id: database
        run: |
          set -euo pipefail
          # Read at deploy time rather than duplicated into GitHub: the
          # credential has one home, and rotating it there is the whole change.
          url="$(gcloud secrets versions access latest --secret=dev-database-url)"
          direct="$(gcloud secrets versions access latest --secret=dev-direct-database-url)"
          echo "::add-mask::${url}"
          echo "::add-mask::${direct}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "direct=${direct}" >> "$GITHUB_OUTPUT"

      # The service publishes its own address, and the runtime has to be told
      # what that address is: the API signs download URLs with it.
      - name: Resolve the service address
        id: service
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)' 2>/dev/null || true)"
          if [ -z "${url}" ]; then
            echo "::error::Cloud Run service ${SERVICE} does not exist in ${REGION}"
            echo "See docs/13-deployment-environments.md, section 6.1, for the one-time provisioning."
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack yarn install --immutable

      # Before the deploy, and on its own: a revision that starts against a
      # database it is ahead of fails in ways a health check cannot describe.
      # A failure here leaves the running revision untouched.
      - name: Migrate the dev database
        env:
          DATABASE_URL: ${{ steps.database.outputs.url }}
          DIRECT_DATABASE_URL: ${{ steps.database.outputs.direct }}
        run: corepack yarn workspace @country-flags/backend prisma migrate deploy

      # The whole configuration is set on every deploy rather than updated in
      # place. A hosted start refuses test defaults and requires each of these,
      # so what the service runs with has to be readable here rather than being
      # whatever a console session last left on it — and a value edited by hand
      # is deliberately overwritten by the next deploy.
      #
      # `^;^` makes the separator a semicolon: a client-id list is itself
      # comma-separated, so a comma cannot also separate the variables.
      - name: Deploy the revision
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --region "${REGION}" \
            --image "${{ steps.image.outputs.reference }}" \
            --service-account "api-dev-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "^;^NODE_ENV=production;DEPLOYMENT_ENV=dev;LOG_LEVEL=info;SERVICE_NAME=country-flags-api;SERVICE_RELEASE=${{ steps.commit.outputs.sha }};PUBLIC_BASE_URL=${{ steps.service.outputs.url }};AUTH_ACCESS_TOKEN_ISSUER=country-flags-dev;AUTH_ACCESS_TOKEN_AUDIENCE=country-flags-api;APPLE_CLIENT_IDS=${APPLE_CLIENT_IDS};GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}" \
            --set-secrets "DATABASE_URL=dev-database-url:latest,DIRECT_DATABASE_URL=dev-direct-database-url:latest,AUTH_ACCESS_TOKEN_SECRET=dev-auth-access-token-secret:latest,AUTH_RATE_LIMIT_SECRET=dev-auth-rate-limit-secret:latest,ACCOUNT_DATA_HASH_SECRET=dev-account-data-hash-secret:latest" \
            --quiet
        env:
          # Apple's client id for a native app is its bundle id, and the Dev
          # scheme builds this one.
          APPLE_CLIENT_IDS: app.countryflags.mobile.dev
          # No Google OAuth client exists for dev yet (#58 provisions it). The
          # value is deliberately one no token can carry, so a provider sign-in
          # is refused rather than accepted against the wrong client.
          GOOGLE_CLIENT_IDS: unprovisioned.apps.googleusercontent.com

      # Deployed is not the same as working. The revision has to answer before
      # the run is called a success, or a broken image would be reported green.
      - name: Wait for readiness
        id: ready
        run: |
          set -euo pipefail
          url="${{ steps.service.outputs.url }}/v1/health/ready"
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' "${url}" || true)"
            if [ "${code}" = "200" ]; then
              echo "Ready after ${attempt} attempt(s)"
              cat /tmp/ready.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url} did not become ready"
          cat /tmp/ready.json || true
          exit 1

      - name: Smoke test the public surface
        id: smoke
        run: |
          set -euo pipefail
          base="${{ steps.service.outputs.url }}"
          # The manifest is the one read every client makes before anything
          # else, so it is the cheapest proof that content is actually served.
          code="$(curl -sS -o /tmp/manifest.json -w '%{http_code}' "${base}/v1/content/manifest?locale=en" || true)"
          case "${code}" in
            200|404)
              # 404 is a deployment with no published release yet, which is a
              # working API rather than a broken one.
              echo "Manifest responded ${code}" ;;
            *)
              echo "::error::Manifest responded ${code}"
              cat /tmp/manifest.json || true
              exit 1 ;;
          esac

      # A revision that never listens says only that it did not listen, and a
      # readiness that never arrives says even less. The reason is in the
      # revision's own log, and printing it here is what makes the next failure
      # diagnosable without a console.
      - name: Report what the revision logged
        if: >-
          failure() && (steps.deploy.outcome == 'failure' ||
          steps.ready.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          set -euo pipefail
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE}" \
            --project "${PROJECT_ID}" \
            --freshness 15m \
            --limit 50 \
            --order desc \
            --format 'value(textPayload,jsonPayload.message)' || true

      - name: Record the deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ steps.commit.outputs.sha }}',
              environment: 'dev',
              auto_merge: false,
              required_contexts: [],
              description: 'Cloud Run api-dev',
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: '${{ steps.service.outputs.url }}',
              description: 'Ready and smoke tested',
            });
