services:
  api:
    profiles:
      - app
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://country_flags:country_flags@postgres:5432/country_flags?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: country_flags
      POSTGRES_USER: country_flags
      POSTGRES_PASSWORD: country_flags
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U country_flags -d country_flags
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - country-flags-postgres:/var/lib/postgresql/data

volumes:
  country-flags-postgres:
