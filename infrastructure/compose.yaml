services:
  api:
    profiles:
      - app
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # The production build running against local infrastructure: NODE_ENV stays
      # production, DEPLOYMENT_ENV says which resources it may touch.
      NODE_ENV: production
      DEPLOYMENT_ENV: local
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://country_flags:country_flags@postgres:5432/country_flags?schema=public
      DIRECT_DATABASE_URL: postgresql://country_flags:country_flags@postgres:5432/country_flags?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: country_flags
      POSTGRES_USER: country_flags
      POSTGRES_PASSWORD: country_flags
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U country_flags -d country_flags
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - country-flags-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: country_flags
      MINIO_ROOT_PASSWORD: country_flags
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - country-flags-minio:/data

volumes:
  country-flags-postgres:
  country-flags-minio:
