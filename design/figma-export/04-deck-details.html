<!DOCTYPE html><html><head><meta charset="utf-8"><title>Колода · Полки</title><style>
  * { box-sizing:border-box; margin:0; }
  body { background:#0a0a0f; font:17px/1.4 -apple-system,'SF Pro Text',system-ui,sans-serif;
    color:#fff; -webkit-font-smoothing:antialiased; width:393px; }
  .phone { width:393px; height:852px; position:relative; overflow:hidden; background:#0a0a0f; }
  .scene { position:absolute; inset:0;
    background:
      radial-gradient(420px 420px at 20% 12%, rgba(43,99,255,.21), transparent 70%),
      radial-gradient(420px 420px at 85% 30%, rgba(224,16,47,.17), transparent 70%),
      radial-gradient(380px 380px at 50% 100%, rgba(43,99,255,.11), transparent 70%); }
  .content { position:relative; height:100%; padding:59px 24px 24px; display:flex;
    flex-direction:column; gap:16px; }
  .glass { background:rgba(255,255,255,.065); border:1px solid rgba(255,255,255,.13);
    border-radius:20px; padding:16px; }
  .cta { background:#fff; color:#000; border-radius:999px; height:56px; display:flex;
    align-items:center; justify-content:center; font-weight:700; font-size:17px; }
  .glassbtn { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);
    border-radius:999px; height:50px; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:16px; }
  .label { font-size:12px; font-weight:650; letter-spacing:1.2px; text-transform:uppercase;
    color:rgba(255,255,255,.5); }
  .title { font-size:34px; font-weight:700; letter-spacing:-.4px; }
  .section { font-size:17px; font-weight:600; }
  .cap { font-size:13px; color:rgba(255,255,255,.55); }
  .hero { font:900 34px/1 'SF Pro Rounded',-apple-system,system-ui; letter-spacing:-.5px;
    font-variant-numeric:tabular-nums; }
  .track { position:relative; height:6px; border-radius:4px; background:rgba(255,255,255,.15); }
  .track i { position:absolute; inset:0 auto 0 0; border-radius:4px; }
  .row { display:flex; align-items:center; gap:8px; min-height:44px; }
  .chev { color:rgba(255,255,255,.4); font-size:14px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1;
    font-size:10px; color:rgba(255,255,255,.55); }
  .tab.on { color:#fff; }
  .tabbar { position:absolute; left:16px; right:16px; bottom:20px; height:64px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:999px; display:flex; align-items:center; padding:0 10px;
    backdrop-filter:blur(20px); }
  .flag { border-radius:5px; line-height:1; display:flex; align-items:center;
    justify-content:center; }
</style></head><body><div class="phone"><div class="scene"></div><div class="content" style="gap:20px">
  <div style="text-align:center" class="section">Африка</div>
  <div class="cta">Начать занятие</div>
  <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px;align-items:baseline"><span class="label">Выучено</span>
      <span class="cap" style="font-variant-numeric:tabular-nums">12</span></div>
      <div style="display:flex;gap:8px;overflow:hidden"><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇪🇬</div>
      <span style="font-size:13px">Египет</span>
      <span class="cap" style="font-size:13px">через 3 дн.</span></div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇳🇬</div>
      <span style="font-size:13px">Нигерия</span>
      <span class="cap" style="font-size:13px">через нед.</span></div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇰🇪</div>
      <span style="font-size:13px">Кения</span>
      <span class="cap" style="font-size:13px">к повторению</span></div></div></div>
  <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px;align-items:baseline"><span class="label">В процессе</span>
      <span class="cap" style="font-variant-numeric:tabular-nums">8</span></div>
      <div style="display:flex;gap:8px;overflow:hidden"><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇲🇦</div>
      <span style="font-size:13px">Марокко</span>
      <span class="cap" style="font-size:13px">через 10 мин.</span></div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇹🇳</div>
      <span style="font-size:13px">Тунис</span>
      <span class="cap" style="font-size:13px">через час</span></div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇬🇭</div>
      <span style="font-size:13px">Гана</span>
      <span class="cap" style="font-size:13px">к повторению</span></div></div></div>
  <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px;align-items:baseline"><span class="label">Не начато</span>
      <span class="cap" style="font-variant-numeric:tabular-nums">34</span></div>
      <div style="display:flex;gap:8px;overflow:hidden"><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;opacity:.55;filter:saturate(.25)">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇸🇳</div>
      <span style="font-size:13px">Сенегал</span>
      </div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;opacity:.55;filter:saturate(.25)">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇨🇲</div>
      <span style="font-size:13px">Камерун</span>
      </div><div style="display:flex;flex-direction:column;gap:4px;width:132px;
      flex-shrink:0;opacity:.55;filter:saturate(.25)">
      <div class="flag" style="width:132px;height:99px;font-size:64px;
        background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px">🇹🇿</div>
      <span style="font-size:13px">Танзания</span>
      </div></div></div>
</div></div></body></html>
