nodeLinker: node-modules
enableGlobalCache: true

# The content pipeline rasterizes flags through a native addon that ships one
# prebuilt binary per platform. Resolving every platform the project builds on
# keeps a lockfile written on a developer's macOS machine installable on the
# Linux CI runner under `--immutable`.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
