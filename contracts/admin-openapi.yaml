openapi: 3.1.0
info:
  title: Country Flags Admin API
  version: 1.0.0
  summary: Contract for the internal catalog administration console
  description: |
    Contract-first REST API for the internal admin console: catalog drafts,
    asset overrides and release proposals. It lives in a separate root on
    purpose: the canonical client contract (`openapi.yaml`) is mirrored
    byte-for-byte into the iOS client generator, so admin operations must
    never appear there (docs/adr/ADR-014-admin-console-architecture.md).
    Operations marked `planned` define the stable contract before their
    NestJS implementation lands.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development backend
tags:
  - name: AdminSession
    description: >-
      Admin identity and session lifecycle, separate from consumer
      authentication.
  - name: AdminAccess
    description: >-
      Admin roster and role management. Every operation requires the ADMIN
      role; hiding a button in the UI is not access control.
  - name: AdminContent
    description: >-
      Read-only view over the active published release, exactly what
      clients can see plus provenance metadata. Open to every
      authenticated admin.
  - name: AdminCommerce
    description: >-
      Entitlements, offers and the store products that sell them. The console
      records the mapping and reads the store; it never creates a product and
      never sets a price.
  - name: AdminReleases
    description: >-
      Starting and watching the publish workflow. The console requests a
      release; CI performs it.
  - name: AdminDrafts
    description: >-
      Versioned editorial drafts. A draft never touches published tables:
      it leaves the database only as a deterministic export headed for a
      pull request. Reads for every admin, mutations for EDITOR and above.
paths:
  /v1/admin/content/status:
    get:
      tags: [AdminContent]
      summary: Get the active release status
      operationId: adminGetContentStatus
      x-implementation-status: implemented
      responses:
        "200":
          description: >-
            The active content version and catalog counts; nulls when no
            release has ever been published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentStatus"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/entities:
    get:
      tags: [AdminContent]
      summary: List published entities
      operationId: adminListEntities
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive search over names, slug, content key and ISO
            codes.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: One page of published entities, ordered by slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntityList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/entities/{entityId}:
    get:
      tags: [AdminContent]
      summary: Get one published entity
      operationId: adminGetEntity
      x-implementation-status: implemented
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The entity with all names and published assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntityDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/decks:
    get:
      tags: [AdminContent]
      summary: List published decks
      operationId: adminListDecks
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of published decks, ordered by code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeckList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/decks/{deckId}:
    get:
      tags: [AdminContent]
      summary: Get one published deck
      operationId: adminGetDeck
      x-implementation-status: implemented
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The deck with all localizations and its rule spec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeckDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/auth/google:
    post:
      tags: [AdminSession]
      summary: Sign in with an allowlisted Google account
      operationId: adminLoginWithGoogle
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGoogleLoginRequest"
      responses:
        "200":
          description: >-
            Admin session established; the opaque session cookie is set on
            the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The account is not allowlisted, is disabled, or the request
            origin is not an admin console origin. The response does not
            reveal which.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "429":
          $ref: ./openapi/components.yaml#/responses/RateLimitResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/auth/logout:
    post:
      tags: [AdminSession]
      summary: Revoke the current admin session
      operationId: adminLogout
      x-implementation-status: implemented
      responses:
        "204":
          description: Session revoked and the session cookie cleared.
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The request origin is not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts:
    get:
      tags: [AdminDrafts]
      summary: List editorial drafts
      operationId: adminListDrafts
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of drafts, most recently updated first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    post:
      tags: [AdminDrafts]
      summary: Create a draft from the current editorial catalog
      operationId: adminCreateDraft
      x-implementation-status: implemented
      description: >-
        Imports the editorial catalog this deployment carries and records
        the catalog commit (`baseCatalogCommit`) and the active content
        version the draft starts from.
      responses:
        "201":
          description: The imported draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "409":
          description: No active content release exists to start from.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: Get one draft with its document
      operationId: adminGetDraft
      x-implementation-status: implemented
      responses:
        "200":
          description: The draft, including its editorial document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminDrafts]
      summary: Replace the draft document
      operationId: adminUpdateDraft
      x-implementation-status: implemented
      description: >-
        Optimistic concurrency: `If-Match` carries the revision the client
        edited. A stale revision gets 409 instead of silently overwriting a
        colleague's work; a missing header gets 428. The document must
        conform to the versioned editorial-catalog JSON Schema.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"?[0-9]+"?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftUpdateRequest"
      responses:
        "200":
          description: The updated draft with a bumped revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          description: The If-Match header with the draft revision is missing.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/decks:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: List the decks a draft holds
      operationId: adminListDraftDecks
      x-implementation-status: implemented
      description: >-
        Each deck reports its membership mode and the number of entities it
        resolves to, following the same rules the release build follows.
      responses:
        "200":
          description: The draft's decks in document order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDeckList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    post:
      tags: [AdminDrafts]
      summary: Add a deck to a draft
      operationId: adminCreateDraftDeck
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftDeckCreateRequest"
      responses:
        "201":
          description: The deck was added; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/decks/{deckKey}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
      - name: deckKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    get:
      tags: [AdminDrafts]
      summary: Get one draft deck with its resolved members
      operationId: adminGetDraftDeck
      x-implementation-status: implemented
      responses:
        "200":
          description: The deck and the entity keys it currently resolves to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDeckDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminDrafts]
      summary: Change a draft deck
      operationId: adminUpdateDraftDeck
      x-implementation-status: implemented
      description: >-
        Only the fields present in the request are replaced, so renaming a
        deck cannot silently rewrite an `all-current` membership into a list.
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftDeckUpdateRequest"
      responses:
        "200":
          description: The deck was changed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    delete:
      tags: [AdminDrafts]
      summary: Remove a deck from a draft
      operationId: adminDeleteDraftDeck
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      responses:
        "200":
          description: The deck was removed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          description: >-
            The draft moved on, or this is the catalog's last deck.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/entities:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: List the editorial entities a draft holds
      operationId: adminListDraftEntities
      x-implementation-status: implemented
      description: >-
        The editorial record of every entity — the selection and the
        overrides, never the merged build result — beside the short name the
        active release serves, so the list is readable by a human.
      responses:
        "200":
          description: The draft's entities in document order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftEntityList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/entities/{entityKey}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
      - name: entityKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    get:
      tags: [AdminDrafts]
      summary: Get one editorial entity with its published context
      operationId: adminGetDraftEntity
      x-implementation-status: implemented
      responses:
        "200":
          description: >-
            The editorial record and the names the active release currently
            serves, which are what an override falls back to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftEntityDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminDrafts]
      summary: Change an editorial entity
      operationId: adminUpdateDraftEntity
      x-implementation-status: implemented
      description: >-
        Each field present in the request replaces the entity's field
        outright; `identifiers` and `overrides` replace as whole maps, and an
        empty map removes the field. There is no POST and no DELETE: an
        entity exists because upstream sources describe it, so the console
        edits the selection but never invents a country.
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftEntityUpdateRequest"
      responses:
        "200":
          description: The entity was changed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/assets:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: List the assets uploaded into a draft
      operationId: adminListDraftAssets
      x-implementation-status: implemented
      responses:
        "200":
          description: The draft's uploaded assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftAssetList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    post:
      tags: [AdminDrafts]
      summary: Upload a replacement asset into a draft
      operationId: adminUploadDraftAsset
      x-implementation-status: implemented
      description: >-
        Multipart upload. The bytes decide what the file is — the filename
        and the declared media type are ignored — and only SVG or PNG is
        accepted. SVG is sanitized before storage, the checksum, dimensions
        and aspect ratio are computed server-side, and the object lands in a
        non-public bucket that is only ever read back through the preview
        endpoint. Re-uploading identical bytes returns the existing asset
        rather than creating a second one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdminDraftAssetUploadRequest"
      responses:
        "201":
          description: The stored draft asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftAsset"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "422":
          description: >-
            The file is empty, too large, not an SVG or PNG, unsafe, or the
            required provenance fields are missing.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/assets/{assetId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
      - name: assetId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    patch:
      tags: [AdminDrafts]
      summary: Change an uploaded asset's metadata
      operationId: adminUpdateDraftAsset
      x-implementation-status: planned
      description: >-
        Provenance, validity and the symbol's localized name and story. New
        bytes still arrive through the upload endpoint: correcting a licence
        is a different act from replacing a drawing, and only one of them
        changes what the reader sees.
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftAssetPatchRequest"
      responses:
        "200":
          description: The asset was changed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    delete:
      tags: [AdminDrafts]
      summary: Remove an uploaded asset from a draft
      operationId: adminDeleteDraftAsset
      x-implementation-status: implemented
      responses:
        "204":
          description: The asset is no longer part of the draft.
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
