      operationId: adminGetStoreTransaction
      x-implementation-status: planned
      description: >-
        Support diagnostics only. Store identifiers are masked and the signed
        payload is never returned: what a support agent needs is whether a
        purchase landed and what it granted. Requires `ADMIN`.
      responses:
        "200":
          description: The transaction, with masked identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStoreTransaction"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller is below the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/commerce/transactions/{transactionId}/reconcile:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    post:
      tags: [AdminCommerce]
      summary: Re-read one transaction from the store
      operationId: adminReconcileStoreTransaction
      x-implementation-status: planned
      description: >-
        Asks the store for the current truth about this transaction and
        applies it. The repair path for a notification that never arrived.
        Requires `ADMIN`.
      responses:
        "200":
          description: The transaction after reconciliation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStoreTransaction"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller is below the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/users:
    get:
      tags: [AdminAccess]
      summary: List admin users
      operationId: adminListUsers
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of the admin roster, ordered by email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller does not hold the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/users/{adminUserId}:
    parameters:
      - name: adminUserId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminAccess]
      summary: Get one admin user
      operationId: adminGetUser
      x-implementation-status: implemented
      responses:
        "200":
          description: The admin user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller does not hold the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminAccess]
      summary: Change an admin user's role or status
      operationId: adminUpdateUser
      x-implementation-status: implemented
      description: >-
        Any effective change revokes every active session of the target, so
        new privileges never ride on old sessions. An administrator cannot
        change their own role or status — the contour must not be able to
        lock itself out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: The updated admin user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller does not hold the ADMIN role, targets themselves, or
            the request origin is not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/me:
    get:
      tags: [AdminSession]
      summary: Get the authenticated admin user
      operationId: getAdminMe
      x-implementation-status: implemented
      responses:
        "200":
          description: The admin user bound to the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
              example:
                id: 8f1f9f76-1f0a-4a2e-9a5e-2b8f4f1c9d10
                email: editor@example.com
                displayName: Content Editor
                role: VIEWER
                status: ACTIVE
                createdAt: 2026-08-23T10:00:00Z
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
components:
  parameters:
    AdminOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    DraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: The draft revision the editor read, for optimistic concurrency.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    AdminLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    DraftIfMatchRequired:
      description: The If-Match header with the draft revision is missing.
      content:
        application/json:
          schema:
            $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cf_admin_session
      description: >-
        Opaque, HttpOnly, server-side admin session cookie. The browser
        reaches the API same-origin through the console's `/api` reverse
        proxy; the cookie is never exposed to scripts or stored elsewhere.
  schemas:
    AdminGoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 16
          maxLength: 4096
          description: Google ID token issued to the admin console's OAuth client.
    AdminRole:
      type: string
      description: >-
        Closed protocol enum (ADR-009): roles drive the console state
        machine, so adding one is a breaking change of the admin contract.
      enum: [VIEWER, EDITOR, PUBLISHER, ADMIN]
    AdminUserStatus:
      type: string
      description: >-
        Closed protocol enum (ADR-009). A disabled admin loses access
        immediately, including active sessions.
      enum: [ACTIVE, DISABLED]
    AdminUser:
      type: object
      required: [id, email, displayName, role, status, createdAt]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminUserStatus"
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          minimum: 0
    AdminUserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminUserStatus"
    AdminDraftStatus:
      type: string
      description: >-
        Closed protocol enum (ADR-009): the console's editorial state
        machine depends on these values.
      enum: [DRAFT, VALIDATING, READY, PROPOSED, MERGED, FAILED]
    AdminDraftSummary:
      type: object
      required:
        - id
        - baseContentVersion
        - baseCatalogCommit
        - schemaVersion
        - revision
        - status
        - proposalUrl
        - createdByAdminUserId
        - updatedByAdminUserId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        baseContentVersion:
          type: string
        baseCatalogCommit:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        proposalUrl:
          type: [string, "null"]
        createdByAdminUserId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        updatedByAdminUserId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
        updatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminDraftList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftSummary"
        total:
          type: integer
          minimum: 0
    AdminDraftDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDraftSummary"
        - type: object
          required: [document, validationReport]
          properties:
            document:
              type: object
              description: >-
                The editorial catalog document, validated server-side
                against the versioned editorial-catalog JSON Schema.
            validationReport:
              type: [object, "null"]
    AdminDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
          description: >-
            Full replacement of the editorial document; must conform to the
            editorial-catalog JSON Schema or the request is refused.
    AdminDraftStamp:
      type: object
      required: [draftId, revision, status, updatedAt]
      properties:
        draftId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        updatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminDeckLocalizedText:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
    AdminDeckCardRef:
      description: >-
        One card variant: an entity taught through a named template. A bare
        key takes the deck's default template, which is why a deck that lists
        bare keys must declare one. Germany under two templates is two cards
        with two schedules, and a deck says which of them it holds.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 200
        - type: object
          additionalProperties: false
          required: [entityKey, templateCode, templateSchemaVersion]
          properties:
            entityKey:
              type: string
              minLength: 1
              maxLength: 200
            templateCode:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              maxLength: 100
            templateSchemaVersion:
              type: integer
              minimum: 1
    AdminDeckMembers:
      description: >-
        The three shapes the editorial model supports: the whole approved
        catalog, an explicit list of card variants, or a taxonomy node whose
        descendants form the deck.
      oneOf:
        - type: string
          const: all-current
        - type: array
          items:
            $ref: "#/components/schemas/AdminDeckCardRef"
        - type: object
          additionalProperties: false
          required: [taxonomy]
          properties:
            taxonomy:
              type: string
              minLength: 1
              maxLength: 200
    AdminDeckAccess:
      description: >-
        Who may open the deck. Absent means free. No price: the store owns
        what a thing costs, and the console never promises one.
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          enum: [FREE, ENTITLEMENT]
        requiredEntitlementKey:
          description: >-
            Present exactly when the model is `ENTITLEMENT`. Read-only once
            the deck is published: changing it is an entitlement migration,
            not an edit.
          type: [string, "null"]
          minLength: 1
          maxLength: 120
    AdminDeckResolvedCard:
      description: >-
        One member as the publisher would materialize it. This is what the
        editor shows instead of guessing: `memberKeys` could not say which of
        an entity's cards a deck holds.
      type: object
      required: [entityKey, templateCode, templateSchemaVersion, sortOrder]
      properties:
        learningCardId:
          description: >-
            The published card this member resolves to, null while the pair
            has never been published.
          type: [string, "null"]
        entityKey:
          type: string
        templateCode:
          type: string
        templateSchemaVersion:
          type: integer
          minimum: 1
        assetType:
          type: [string, "null"]
          description: The prompt asset the template reads, when it has one.
        sortOrder:
          type: integer
          minimum: 0
    AdminDraftDeck:
      type: object
      required: [key, kind, names, membersMode, members, memberCount]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        membersMode:
          type: string
          enum: [all-current, explicit, taxonomy]
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
        memberCount:
          type: integer
          minimum: 0
        defaultTemplateCode:
          description: >-
            The template a bare member key is taught through. Required when
            the deck lists bare keys; a catalog written before templates
            existed reads as `FLAG_TO_COUNTRY` v1.
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
        defaultTemplateSchemaVersion:
          type: integer
          minimum: 1
        access:
          $ref: "#/components/schemas/AdminDeckAccess"
        previewCardIds:
          description: >-
            Up to three cards a locked deck may show before it is bought.
            Each must be a member, and each is published as public on
            purpose.
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
    AdminDraftDeckList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftDeck"
        total:
          type: integer
          minimum: 0
    AdminDraftDeckDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDraftDeck"
        - type: object
          required: [memberKeys]
          properties:
            memberKeys:
              deprecated: true
              type: array
              description: >-
                The entity keys the deck resolves to right now, sorted the
                way the release build sorts them. Ambiguous once an entity
                has several cards — it cannot say which of them the deck
                holds — and kept only while the console migrates to
                `resolvedMemberCards`.
              items:
                type: string
            resolvedMemberCards:
              description: >-
                The members as the publisher would materialize them, in
                editorial order.
              type: array
              items:
                $ref: "#/components/schemas/AdminDeckResolvedCard"
    AdminDraftDeckCreateRequest:
      type: object
      additionalProperties: false
      required: [key, kind, names, members]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
        defaultTemplateCode:
          description: >-
            The template a bare member key is taught through. Required when
            the deck lists bare keys; a catalog written before templates
            existed reads as `FLAG_TO_COUNTRY` v1.
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
        defaultTemplateSchemaVersion:
          type: integer
          minimum: 1
        access:
          $ref: "#/components/schemas/AdminDeckAccess"
        previewCardIds:
          description: >-
            Up to three cards a locked deck may show before it is bought.
            Each must be a member, and each is published as public on
            purpose.
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
    AdminDraftDeckUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
        defaultTemplateCode:
          description: >-
            The template a bare member key is taught through. Required when
            the deck lists bare keys; a catalog written before templates
            existed reads as `FLAG_TO_COUNTRY` v1.
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
        defaultTemplateSchemaVersion:
          type: integer
          minimum: 1
        access:
          $ref: "#/components/schemas/AdminDeckAccess"
        previewCardIds:
          description: >-
            Up to three cards a locked deck may show before it is bought.
            Each must be a member, and each is published as public on
            purpose.
          type: array
          maxItems: 3
          items:
            type: string
            minLength: 1
    AdminEntityType:
      description: >-
        What the entity is. `subdivision` is an administrative unit of a
        country — a U.S. state — and it needs a `parentKey`, stays out of the
        country catalog, and is taught only through a deck that names it.
      type: string
      enum: [country, territory, area, subdivision, region, subregion]
    AdminEntityStatus:
      type: string
      enum: [active, historical, retired, hidden]
    AdminEntityIdentifiers:
      type: object
      additionalProperties: false
      properties:
        isoAlpha2:
          type: string
          pattern: ^[A-Za-z]{2}$
        isoAlpha3:
          type: string
          pattern: ^[A-Za-z]{3}$
        m49:
          type: string
          pattern: ^[0-9]{3}$
        isoSubdivision:
          description: >-
            ISO 3166-2, such as `US-CA`. It has a field of its own because it
            is not a country code: written into `isoAlpha2` it would put a
            state everywhere a reader expects a country.
          type: string
          pattern: ^[A-Za-z]{2}-[A-Za-z0-9]{1,3}$
        localCode:
          description: The official code the parent country uses for the unit.
          type: string
          minLength: 1
          maxLength: 40
        fipsCode:
          description: Only where the source publishes one; never derived.
          type: string
          minLength: 1
          maxLength: 10
        wikidataId:
          type: string
          minLength: 1
        editorialKey:
          type: string
          minLength: 1
        customCode:
          type: string
          minLength: 1
    AdminEntityLocalizedValue:
      description: Locale → the value in that locale.
      type: object
      minProperties: 1
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 200
    AdminEntityMeasuredValue:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: number
        unit:
          type: string
          minLength: 1
          maxLength: 40
        observedAt:
          type: string
          format: date
    AdminEntityFacts:
      description: >-
        The facts a curator edits by hand. They are typed rather than hidden
        in the override map because a state's admission date and a country's
        capital are answers to questions, not free-form strings, and the card
        back renders them by type.
      type: object
      additionalProperties: false
      properties:
        capital:
          $ref: "#/components/schemas/AdminEntityLocalizedValue"
        largestCity:
          $ref: "#/components/schemas/AdminEntityLocalizedValue"
        motto:
          $ref: "#/components/schemas/AdminEntityLocalizedValue"
        statehoodDate:
          description: >-
            When the unit joined the entity above it. Meaningful for a
            subdivision; left unset for everything else.
          type: string
          format: date
        population:
          $ref: "#/components/schemas/AdminEntityMeasuredValue"
        area:
          $ref: "#/components/schemas/AdminEntityMeasuredValue"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntityLocalizedValue"
    AdminEntityOverrides:
      type: object
      description: >-
        Dotted-path patches the editorial layer pins on purpose
        (`names.ru.short` → value), applied with the pipeline's highest
        priority. Absence of the field means no overrides; an empty object
        is never stored.
      additionalProperties: true
    AdminDraftEntityListItem:
      type: object
      required:
        - key
        - type
        - status
        - includeInCountryCatalog
        - recognitionStatus
        - identifiers
        - overrideCount
        - publishedName
      properties:
        key:
          type: string
        type:
          $ref: "#/components/schemas/AdminEntityType"
        status:
          $ref: "#/components/schemas/AdminEntityStatus"
        includeInCountryCatalog:
          type: boolean
        recognitionStatus:
          type: string
        identifiers:
          $ref: "#/components/schemas/AdminEntityIdentifiers"
        parentKey:
          type: [string, "null"]
        hasFlag:
          description: >-
            Whether the entity already has a flag in this draft. Carried by
            the list so "missing a coat of arms" is a filter rather than a
            request per row.
          type: boolean
        hasCoatOfArms:
          type: boolean
        overrideCount:
          type: integer
          minimum: 0
        publishedName:
          type: [string, "null"]
          description: >-
            The short name the active release serves, null when the release
            does not carry the entity yet.
    AdminDraftEntityList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftEntityListItem"
        total:
          type: integer
          minimum: 0
    AdminDraftEntity:
      type: object
      required: [key, type, status, includeInCountryCatalog, recognitionStatus]
      properties:
        key:
          type: string
        type:
          $ref: "#/components/schemas/AdminEntityType"
        status:
          $ref: "#/components/schemas/AdminEntityStatus"
        includeInCountryCatalog:
          type: boolean
        recognitionStatus:
          type: string
        recognitionAsOf:
          type: string
          format: date
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        parentKey:
          description: >-
            The country or territory an administrative unit belongs to.
            Required of a `subdivision` and meaningless anywhere else; the
            publisher turns it into the canonical administrative relation.
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        facts:
          $ref: "#/components/schemas/AdminEntityFacts"
        identifiers:
          $ref: "#/components/schemas/AdminEntityIdentifiers"
        overrides:
          $ref: "#/components/schemas/AdminEntityOverrides"
    AdminDraftEntityDetail:
      type: object
      required: [entity, publishedNames]
      properties:
        entity:
          $ref: "#/components/schemas/AdminDraftEntity"
        publishedNames:
          type: object
          description: >-
            Locale → the short name the active release serves; what an
            override the entity does not carry falls back to at build time.
          additionalProperties:
            type: string
    AdminDraftEntityUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: "#/components/schemas/AdminEntityType"
        status:
          $ref: "#/components/schemas/AdminEntityStatus"
        includeInCountryCatalog:
          type: boolean
        recognitionStatus:
          type: string
          minLength: 1
          maxLength: 100
        recognitionAsOf:
          type: [string, "null"]
          description: An ISO date, or null to clear the field.
        validFrom:
          type: [string, "null"]
        validTo:
          type: [string, "null"]
        parentKey:
          description: >-
            An entity key, or null to clear it. Non-null is required of a
            `subdivision`, and null is required of anything else.
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        facts:
          $ref: "#/components/schemas/AdminEntityFacts"
        identifiers:
          $ref: "#/components/schemas/AdminEntityIdentifiers"
        overrides:
          $ref: "#/components/schemas/AdminEntityOverrides"
    AdminDraftAsset:
      type: object
      required:
        - id
        - draftId
        - entityContentKey
        - assetType
        - variant
        - mimeType
        - sha256
        - width
        - height
        - aspectRatio
        - sourceUrl
        - licenseName
        - licenseUrl
        - attribution
        - replacementReason
        - validationStatus
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        draftId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        entityContentKey:
          type: string
        assetType:
          type: string
          minLength: 1
          x-extensible-enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
        variant:
          type: string
        mimeType:
          type: string
          enum: [image/svg+xml, image/png]
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        aspectRatio:
          type: [number, "null"]
        sourceUrl:
          type: [string, "null"]
        licenseName:
          type: [string, "null"]
        licenseUrl:
          type: [string, "null"]
        attribution:
          type: [string, "null"]
        replacementReason:
          type: [string, "null"]
        validationStatus:
          type: string
          enum: [PENDING, VALID, INVALID]
        validFrom:
          description: >-
            When this drawing came into force. Null for one that simply is
            the current symbol.
          type: [string, "null"]
          format: date
        validTo:
          type: [string, "null"]
          format: date
        localizations:
          $ref: "#/components/schemas/AdminAssetLocalizations"
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
        updatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminAssetLocalization:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
    AdminAssetLocalizations:
      description: >-
        What this drawing is called and what it means, per locale. It belongs
        to the asset rather than to the entity: the story of the German
        federal eagle is the story of one symbol, and replacing that symbol
        replaces its story without touching the flag beside it.
      type: object
      additionalProperties:
        $ref: "#/components/schemas/AdminAssetLocalization"
    AdminDraftAssetPatchRequest:
      description: >-
        Metadata, validity and localizations only. New bytes still arrive
        through the upload endpoint, because replacing a drawing is a
        different act from correcting its licence.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2000
        licenseName:
          type: string
          minLength: 1
          maxLength: 200
        licenseUrl:
          type: [string, "null"]
          maxLength: 2000
        attribution:
          type: [string, "null"]
          maxLength: 300
        replacementReason:
          type: string
          minLength: 1
          maxLength: 2000
        validFrom:
          type: [string, "null"]
        validTo:
          type: [string, "null"]
        localizations:
          $ref: "#/components/schemas/AdminAssetLocalizations"
    AdminDraftAssetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftAsset"
        total:
          type: integer
          minimum: 0
    AdminDraftAssetUploadRequest:
      type: object
      additionalProperties: false
      required:
        - file
        - entityContentKey
        - assetType
        - sourceUrl
        - licenseName
        - replacementReason
      properties:
        file:
          type: string
          format: binary
        entityContentKey:
          type: string
          minLength: 1
          maxLength: 200
        assetType:
          type: string
          enum: [FLAG, COAT_OF_ARMS, MAP]
        variant:
          type: string
          minLength: 1
          maxLength: 50
          default: default
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2000
        licenseName:
          type: string
          minLength: 1
          maxLength: 200
        licenseUrl:
          type: string
          minLength: 1
          maxLength: 2000
        attribution:
          type: string
          minLength: 1
          maxLength: 500
        replacementReason:
          description: >-
            Why a human replaced the upstream drawing. Required: it travels
            into the proposal and the audit trail.
          type: string
          minLength: 1
          maxLength: 2000
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        localizations:
          description: >-
            `AdminAssetLocalizations` as a JSON string, because this is a
            multipart form and a form field carries text.
          type: string
          maxLength: 8000
    AdminCommerceStatus:
      type: object
      required:
        [storeEnvironment, activeOfferCount, offersWithoutValidatedProduct]
      properties:
        storeEnvironment:
          description: >-
            Which store this deployment talks to. Shown on every commerce
            screen, because mapping a Sandbox product while looking at
            production is the mistake this section has to make impossible.
          type: string
          x-extensible-enum: [LOCAL_TEST, SANDBOX, PRODUCTION]
        activeOfferCount:
          type: integer
          minimum: 0
        offersWithoutValidatedProduct:
          description: >-
            Active offers that cannot be sold on this platform yet. A paid
            deck may not reach READY while it has one.
          type: integer
          minimum: 0
        lastReconciliationAt:
          type: [string, "null"]
          format: date-time
        lastReconciliationError:
          type: [string, "null"]
    AdminEntitlement:
      type: object
      required: [key, status, deckCodes]
      properties:
        key:
          type: string
          minLength: 1
        status:
          type: string
          x-extensible-enum: [ACTIVE, RETIRED]
        description:
          type: [string, "null"]
        deckCodes:
          description: The published decks this key opens.
          type: array
          items:
            type: string
    AdminEntitlementList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntitlement"
        total:
          type: integer
          minimum: 0
    AdminEntitlementCreateRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]*(?:\.[a-z0-9_]+)+$
          maxLength: 120
        description:
          type: string
          maxLength: 500
    AdminCommerceOffer:
      type: object
      required: [id, code, kind, status, grants, products]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        kind:
          type: string
          x-extensible-enum: [ONE_TIME]
        status:
          type: string
          x-extensible-enum: [DRAFT, ACTIVE, RETIRED]
        sortOrder:
          type: [integer, "null"]
        notes:
          type: [string, "null"]
        grants:
          description: >-
            The entitlement keys a purchase grants. More than one is a
            bundle, which is why an offer is not a deck.
          type: array
          items:
            type: string
        localizations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminStoreProduct"
    AdminCommerceOfferList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminCommerceOffer"
        total:
          type: integer
          minimum: 0
    AdminCommerceOfferCreateRequest:
      type: object
      additionalProperties: false
      required: [code, grants]
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
        kind:
          type: string
          enum: [ONE_TIME]
        grants:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        sortOrder:
          type: integer
        notes:
          type: string
          maxLength: 2000
        localizations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
    AdminCommerceOfferUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        grants:
          description: >-
            May only grow once the offer has sold. Shrinking it is refused:
            a different set of rights is a different product.
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        sortOrder:
          type: [integer, "null"]
        notes:
          type: [string, "null"]
        localizations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
    AdminStoreProduct:
      type: object
      required:
        [
          id,
          provider,
          storeEnvironment,
          bundleId,
          productId,
          productType,
          status,
        ]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        provider:
          type: string
          x-extensible-enum: [APPLE_APP_STORE, GOOGLE_PLAY, WEB]
        storeEnvironment:
          type: string
          x-extensible-enum: [LOCAL_TEST, SANDBOX, PRODUCTION]
        bundleId:
          type: string
        productId:
          type: string
        productType:
          type: string
          x-extensible-enum: [NON_CONSUMABLE]
        status:
          type: string
          x-extensible-enum: [DRAFT, VALIDATED, ACTIVE, RETIRED, INVALID]
        storeStatus:
          description: >-
            Whatever the store last said, kept opaque: it is a diagnostic,
            and nothing decides access by reading it.
          type: [string, "null"]
        lastValidatedAt:
          type: [string, "null"]
          format: date-time
        validationError:
          type: [string, "null"]
    AdminStoreProductCreateRequest:
      type: object
      additionalProperties: false
      required: [provider, storeEnvironment, bundleId, productId]
      properties:
        provider:
          type: string
          enum: [APPLE_APP_STORE, GOOGLE_PLAY, WEB]
        storeEnvironment:
          type: string
          enum: [LOCAL_TEST, SANDBOX, PRODUCTION]
        bundleId:
          type: string
          minLength: 1
          maxLength: 200
        productId:
          type: string
          minLength: 1
          maxLength: 200
        productType:
          type: string
          enum: [NON_CONSUMABLE]
    AdminStoreProductUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [DRAFT, VALIDATED, ACTIVE, RETIRED, INVALID]
    AdminStoreSyncRun:
      type: object
      required: [id, status, startedAt]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        status:
          type: string
          x-extensible-enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        checkedProductCount:
          type: [integer, "null"]
          minimum: 0
        failureMessage:
          type: [string, "null"]
    AdminStoreTransaction:
      description: >-
        A transaction as support may see it: masked identifiers, no signed
        payload, and what it granted.
      type: object
      required:
        [
          id,
          provider,
          storeEnvironment,
          maskedTransactionId,
          productId,
          claimState,
          purchasedAt,
        ]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        provider:
          type: string
          x-extensible-enum: [APPLE_APP_STORE, GOOGLE_PLAY, WEB]
        storeEnvironment:
          type: string
          x-extensible-enum: [LOCAL_TEST, SANDBOX, PRODUCTION]
        maskedTransactionId:
          description: >-
            Enough of the store's identifier to match a support ticket, and
            not enough to be replayed anywhere.
          type: string
        productId:
          type: string
        claimState:
          type: string
          x-extensible-enum:
            [CLAIMED, RELEASED_BY_ACCOUNT_DELETION, CONFLICT, QUARANTINED]
        ownershipType:
          type: string
          x-extensible-enum: [PURCHASED, FAMILY_SHARED, UNKNOWN]
        purchasedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        revocationReason:
          type: [string, "null"]
        grantedEntitlementKeys:
          type: array
          items:
            type: string
    AdminValidationFinding:
      type: object
      required: [level, code, subject, message]
      properties:
        level:
          type: string
          enum: [blocking, warning]
        code:
          type: string
          minLength: 1
        subject:
          type: string
        message:
          type: string
    AdminValidationReport:
      type: object
      required: [validatedAt, blocking, warnings, findings]
      properties:
        validatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
        blocking:
          type: integer
          minimum: 0
        warnings:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AdminValidationFinding"
    AdminDraftValidationResult:
      type: object
      required: [status, revision, report]
      properties:
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        revision:
          type: integer
          minimum: 1
        report:
          $ref: "#/components/schemas/AdminValidationReport"
    AdminDeckDiffEntry:
      description: >-
        An editorial key and a published code are two namespaces, so an entry
        names both: a deck the draft adds has no published code yet, and one
        it drops has no editorial key any more. At least one is always
        present.
      type: object
      required: [deckKey, publishedCode, change, details]
      properties:
        deckKey:
          type: [string, "null"]
        publishedCode:
          type: [string, "null"]
        change:
          type: string
          enum: [added, removed, changed]
        details:
          type: array
          items:
            type: string
    AdminAssetDiffEntry:
      type: object
      required: [entityContentKey, assetType, change, reason]
      properties:
        entityContentKey:
          type: string
        assetType:
          type: string
          minLength: 1
          x-extensible-enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
        change:
          type: string
          enum: [added, replaced]
        reason:
          type: [string, "null"]
    AdminEntityDiffEntry:
      description: >-
        What the draft changed about one editorial entity, against the
        catalog this deployment was built from. Entities cannot be created
        or deleted editorially, so every entry is a change.
      type: object
      required: [entityKey, details]
      properties:
        entityKey:
          type: string
        details:
          type: array
          items:
            type: string
    AdminDraftDiff:
      type: object
      required: [baseContentVersion, isEmpty, decks, assets, entities]
      properties:
        baseContentVersion:
          type: string
        isEmpty:
          type: boolean
          description: True when a release from this draft would change nothing.
        decks:
          type: array
          items:
            $ref: "#/components/schemas/AdminDeckDiffEntry"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AdminAssetDiffEntry"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntityDiffEntry"
    AdminProposalRequest:
      type: object
      additionalProperties: false
      required: [draftRevision, baseContentVersion, baseCatalogCommit]
      description: >-
        What the client believed when it decided to propose. Any
        disagreement is refused rather than resolved silently.
      properties:
        draftRevision:
          type: integer
          minimum: 1
        baseContentVersion:
          type: string
          minLength: 1
        baseCatalogCommit:
          type: string
          minLength: 1
    AdminProposalResult:
      type: object
      required: [draftId, status, proposalUrl, pullRequestNumber]
      properties:
        draftId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        proposalUrl:
          type: string
          format: uri
        pullRequestNumber:
          type: integer
          minimum: 0
    AdminWorkflowRun:
      type: object
      required: [id, status, conclusion, url, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
        conclusion:
          type: [string, "null"]
        url:
          type: string
          format: uri
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminPublishRunStatus:
      type: object
      required: [configured, activeVersion, lastRun]
      properties:
        configured:
          type: boolean
          description: >-
            False when this deployment has no GitHub credential, in which
            case a release is started by hand.
        activeVersion:
          type: [string, "null"]
        lastRun:
          anyOf:
            - $ref: "#/components/schemas/AdminWorkflowRun"
            - type: "null"
    AdminPublishRunRequest:
      type: object
      additionalProperties: false
      required: [contentVersion, minimumClientVersion]
      properties:
        contentVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        minimumClientVersion:
          description: >-
            The oldest client this release lets read it; a client below it
            gets an update screen instead of a catalog, so this is a product
            decision rather than a formatting detail.
          type: string
          pattern: ^\d+\.\d+\.\d+$
    AdminReleaseRun:
      description: >-
        One publish or rollback, as a record rather than as a response.
        Applying a release is a serializable transaction with a twenty-minute
        timeout, which no HTTP request survives, so the request queues a run
        and the executor — a job with its own credentials and the signing key
        this service never sees — carries it out (ADR-017).
      type: object
      required:
        [id, kind, status, contentVersion, requestedByAdminUserId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [PUBLISH, ROLLBACK]
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        contentVersion:
          description: The version this run produces, or the one it returns to.
          type: string
        minimumClientVersion:
          description: >-
            What the release will demand of a client. Null for a rollback:
            the release it returns to already carries its own.
          type: [string, "null"]
        previousVersion:
          description: >-
            What was active when the run started, so the way back is
            recoverable from the record alone.
          type: [string, "null"]
        stage:
          description: Where the run got to, for the screen watching it.
          type: [string, "null"]
        failure:
          anyOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        executionName:
          description: >-
            The executor's own handle, so an operator can find the logs of a
            run that failed outside our reporting.
          type: [string, "null"]
        requestedByAdminUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
    AdminReleaseRunState:
      description: >-
        What is live, what is in flight, and what happened last — the three
        things a screen watching a release has to say at once.
      type: object
      required: [activeVersion, current, last]
      properties:
        activeVersion:
          type: [string, "null"]
        current:
          description: The queued or running run, if there is one.
          anyOf:
            - $ref: "#/components/schemas/AdminReleaseRun"
            - type: "null"
        last:
          description: The most recent run whatever its outcome.
          anyOf:
            - $ref: "#/components/schemas/AdminReleaseRun"
            - type: "null"
    AdminReleasePublishRequest:
      type: object
      additionalProperties: false
      required: [contentVersion, minimumClientVersion]
      properties:
        contentVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        minimumClientVersion:
          description: >-
            The oldest client this release lets read it; a client below it
            gets an update screen instead of a catalog, so this is a product
            decision rather than a formatting detail.
          type: string
          pattern: ^\d+\.\d+\.\d+$
    AdminReleaseRollbackRequest:
      type: object
      additionalProperties: false
      required: [toVersion]
      properties:
        toVersion:
          description: >-
            A version this deployment actually published. Returning to one it
            never applied would point every client at nothing.
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    AdminContentStatus:
      type: object
      required:
        [
          activeVersion,
          schemaVersion,
          publishedAt,
          minimumClientVersion,
          entityCount,
          deckCount,
        ]
      properties:
        activeVersion:
          type: [string, "null"]
        schemaVersion:
          type: [integer, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        minimumClientVersion:
          description: >-
            The client version the live release demands. Raising it in a new
            release locks every older installed app out of the content, so the
            console offers this value as the next release's default rather
            than a number of its own.
          type: [string, "null"]
        entityCount:
          type: integer
          minimum: 0
        deckCount:
          type: integer
          minimum: 0
    AdminAssetRepresentation:
      type: object
      required: [url, mimeType, sha256, scale, widthPx, heightPx]
      properties:
        url:
          type: string
          format: uri
        mimeType:
          type: string
          minLength: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        scale:
          type: [integer, "null"]
        widthPx:
          type: [integer, "null"]
        heightPx:
          type: [integer, "null"]
    AdminAsset:
      type: object
      required:
        - id
        - type
        - variant
        - width
        - height
        - aspectRatio
        - licenseName
        - licenseUrl
        - attribution
        - source
        - representations
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        type:
          type: string
          minLength: 1
          x-extensible-enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
        variant:
          type: string
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        aspectRatio:
          type: [number, "null"]
        licenseName:
          type: string
        licenseUrl:
          type: [string, "null"]
        attribution:
          type: [string, "null"]
        source:
          type: object
          required: [name, url]
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
        representations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminAssetRepresentation"
    AdminEntityName:
      type: object
      required: [locale, nameType, value, isPrimary]
      properties:
        locale:
          $ref: ./openapi/components.yaml#/schemas/Locale
        nameType:
          type: string
          minLength: 1
          x-extensible-enum: [SHORT, OFFICIAL, COMMON, ALTERNATIVE]
        value:
          type: string
        isPrimary:
          type: boolean
    AdminEntitySummary:
      type: object
      required:
        - id
        - contentKey
        - slug
        - kind
        - status
        - recognitionStatus
        - isoAlpha2
        - isoAlpha3
        - nameRu
        - nameEn
        - flag
        - contentVersion
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        contentKey:
          type: string
        slug:
          type: string
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
            [
              COUNTRY,
              TERRITORY,
              DEPENDENCY,
              DISPUTED_AREA,
              REGION,
              SUBREGION,
              OTHER,
            ]
        status:
          type: string
          enum: [ACTIVE, HISTORICAL, HIDDEN]
        recognitionStatus:
          type: string
          minLength: 1
          x-extensible-enum:
            - UN_MEMBER
            - UN_OBSERVER
            - PARTIALLY_RECOGNIZED
            - UNRECOGNIZED
            - DEPENDENT_TERRITORY
            - SPECIAL_AREA
            - NOT_APPLICABLE
        isoAlpha2:
          type: [string, "null"]
        isoAlpha3:
          type: [string, "null"]
        nameRu:
          type: [string, "null"]
        nameEn:
          type: [string, "null"]
        flag:
          anyOf:
            - $ref: "#/components/schemas/AdminAsset"
