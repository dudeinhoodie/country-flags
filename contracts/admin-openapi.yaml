      summary: Queue a publish run
      operationId: adminQueueReleasePublish
      x-implementation-status: implemented
      description: >-
        Records the intent and returns; the executor does the work (ADR-017).
        The response is a run, not a result — a release takes minutes, and an
        endpoint that waited for one would be an endpoint that times out.

        Distinct from `POST /v1/admin/content/releases/publish-run`, which
        dispatches the CI workflow. That path stays: it is the only one that
        can publish from an arbitrary commit, and the way in when this
        contour is broken.

        A second run is refused rather than queued behind the first: a
        request that cannot succeed should be answered now, not after twenty
        minutes of losing a race over the active pointer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReleasePublishRequest"
      responses:
        "202":
