openapi: 3.1.0
info:
  title: Country Flags Admin API
  version: 1.0.0
  summary: Contract for the internal catalog administration console
  description: |
    Contract-first REST API for the internal admin console: catalog drafts,
    asset overrides and release proposals. It lives in a separate root on
    purpose: the canonical client contract (`openapi.yaml`) is mirrored
    byte-for-byte into the iOS client generator, so admin operations must
    never appear there (docs/adr/ADR-014-admin-console-architecture.md).
    Operations marked `planned` define the stable contract before their
    NestJS implementation lands.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development backend
tags:
  - name: AdminSession
    description: >-
      Admin identity and session lifecycle, separate from consumer
      authentication.
  - name: AdminAccess
    description: >-
      Admin roster and role management. Every operation requires the ADMIN
      role; hiding a button in the UI is not access control.
  - name: AdminContent
    description: >-
      Read-only view over the active published release, exactly what
      clients can see plus provenance metadata. Open to every
      authenticated admin.
  - name: AdminDrafts
    description: >-
      Versioned editorial drafts. A draft never touches published tables:
      it leaves the database only as a deterministic export headed for a
      pull request. Reads for every admin, mutations for EDITOR and above.
paths:
  /v1/admin/content/status:
    get:
      tags: [AdminContent]
      summary: Get the active release status
      operationId: adminGetContentStatus
      x-implementation-status: implemented
      responses:
        "200":
          description: >-
            The active content version and catalog counts; nulls when no
            release has ever been published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentStatus"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/entities:
    get:
      tags: [AdminContent]
      summary: List published entities
      operationId: adminListEntities
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive search over names, slug, content key and ISO
            codes.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: One page of published entities, ordered by slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntityList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/entities/{entityId}:
    get:
      tags: [AdminContent]
      summary: Get one published entity
      operationId: adminGetEntity
      x-implementation-status: implemented
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The entity with all names and published assets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEntityDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/decks:
    get:
      tags: [AdminContent]
      summary: List published decks
      operationId: adminListDecks
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of published decks, ordered by code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeckList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/decks/{deckId}:
    get:
      tags: [AdminContent]
      summary: Get one published deck
      operationId: adminGetDeck
      x-implementation-status: implemented
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The deck with all localizations and its rule spec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeckDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/auth/google:
    post:
      tags: [AdminSession]
      summary: Sign in with an allowlisted Google account
      operationId: adminLoginWithGoogle
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGoogleLoginRequest"
      responses:
        "200":
          description: >-
            Admin session established; the opaque session cookie is set on
            the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The account is not allowlisted, is disabled, or the request
            origin is not an admin console origin. The response does not
            reveal which.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "429":
          $ref: ./openapi/components.yaml#/responses/RateLimitResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/auth/logout:
    post:
      tags: [AdminSession]
      summary: Revoke the current admin session
      operationId: adminLogout
      x-implementation-status: implemented
      responses:
        "204":
          description: Session revoked and the session cookie cleared.
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The request origin is not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts:
    get:
      tags: [AdminDrafts]
      summary: List editorial drafts
      operationId: adminListDrafts
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of drafts, most recently updated first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    post:
      tags: [AdminDrafts]
      summary: Create a draft from the current editorial catalog
      operationId: adminCreateDraft
      x-implementation-status: implemented
      description: >-
        Imports the editorial catalog this deployment carries and records
        the catalog commit (`baseCatalogCommit`) and the active content
        version the draft starts from.
      responses:
        "201":
          description: The imported draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "409":
          description: No active content release exists to start from.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: Get one draft with its document
      operationId: adminGetDraft
      x-implementation-status: implemented
      responses:
        "200":
          description: The draft, including its editorial document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminDrafts]
      summary: Replace the draft document
      operationId: adminUpdateDraft
      x-implementation-status: implemented
      description: >-
        Optimistic concurrency: `If-Match` carries the revision the client
        edited. A stale revision gets 409 instead of silently overwriting a
        colleague's work; a missing header gets 428. The document must
        conform to the versioned editorial-catalog JSON Schema.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"?[0-9]+"?$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftUpdateRequest"
      responses:
        "200":
          description: The updated draft with a bumped revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          description: The If-Match header with the draft revision is missing.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/decks:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminDrafts]
      summary: List the decks a draft holds
      operationId: adminListDraftDecks
      x-implementation-status: implemented
      description: >-
        Each deck reports its membership mode and the number of entities it
        resolves to, following the same rules the release build follows.
      responses:
        "200":
          description: The draft's decks in document order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDeckList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    post:
      tags: [AdminDrafts]
      summary: Add a deck to a draft
      operationId: adminCreateDraftDeck
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftDeckCreateRequest"
      responses:
        "201":
          description: The deck was added; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/decks/{deckKey}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
      - name: deckKey
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    get:
      tags: [AdminDrafts]
      summary: Get one draft deck with its resolved members
      operationId: adminGetDraftDeck
      x-implementation-status: implemented
      responses:
        "200":
          description: The deck and the entity keys it currently resolves to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDeckDetail"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminDrafts]
      summary: Change a draft deck
      operationId: adminUpdateDraftDeck
      x-implementation-status: implemented
      description: >-
        Only the fields present in the request are replaced, so renaming a
        deck cannot silently rewrite an `all-current` membership into a list.
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDraftDeckUpdateRequest"
      responses:
        "200":
          description: The deck was changed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          $ref: ./openapi/components.yaml#/responses/ConflictResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    delete:
      tags: [AdminDrafts]
      summary: Remove a deck from a draft
      operationId: adminDeleteDraftDeck
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/DraftIfMatch"
      responses:
        "200":
          description: The deck was removed; the draft's revision moved on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftStamp"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "409":
          description: >-
            The draft moved on, or this is the catalog's last deck.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "428":
          $ref: "#/components/responses/DraftIfMatchRequired"
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/validate:
    post:
      tags: [AdminDrafts]
      summary: Validate a draft against the editorial rules
      operationId: adminValidateDraft
      x-implementation-status: implemented
      description: >-
        Applies the editorial rules a release build applies and stores the
        verdict on the draft: READY when nothing blocks, FAILED otherwise.
        Rules that need the pinned upstream snapshots stay with the build,
        which is the only place that has them.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The stored verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftValidationResult"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller is below the EDITOR role, or the request origin is
            not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/diff:
    get:
      tags: [AdminDrafts]
      summary: Compare a draft with the active release
      operationId: adminDiffDraft
      x-implementation-status: implemented
      description: >-
        What a release built from this draft would change, in the domain's
        own words. Entity facts derived from upstream sources are absent on
        purpose: the console does not own them.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The domain diff against the active release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDraftDiff"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/content/drafts/{draftId}/export:
    get:
      tags: [AdminDrafts]
      summary: Download the deterministic export of a draft
      operationId: adminExportDraft
      x-implementation-status: implemented
      description: >-
        The canonical serialization of the draft document — the exact bytes
        a proposal will commit as `editorial/catalog.json`. An unedited
        draft exports byte-identically to the file it was imported from.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            $ref: ./openapi/components.yaml#/schemas/Uuid
      responses:
        "200":
          description: The canonical catalog.json file.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/users:
    get:
      tags: [AdminAccess]
      summary: List admin users
      operationId: adminListUsers
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/AdminOffset"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: One page of the admin roster, ordered by email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller does not hold the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/users/{adminUserId}:
    parameters:
      - name: adminUserId
        in: path
        required: true
        schema:
          $ref: ./openapi/components.yaml#/schemas/Uuid
    get:
      tags: [AdminAccess]
      summary: Get one admin user
      operationId: adminGetUser
      x-implementation-status: implemented
      responses:
        "200":
          description: The admin user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: The caller does not hold the ADMIN role.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
    patch:
      tags: [AdminAccess]
      summary: Change an admin user's role or status
      operationId: adminUpdateUser
      x-implementation-status: implemented
      description: >-
        Any effective change revokes every active session of the target, so
        new privileges never ride on old sessions. An administrator cannot
        change their own role or status — the contour must not be able to
        lock itself out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateRequest"
      responses:
        "200":
          description: The updated admin user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
            The caller does not hold the ADMIN role, targets themselves, or
            the request origin is not an admin console origin.
          content:
            application/json:
              schema:
                $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
        "404":
          $ref: ./openapi/components.yaml#/responses/NotFoundResponse
        "422":
          $ref: ./openapi/components.yaml#/responses/ValidationResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
  /v1/admin/me:
    get:
      tags: [AdminSession]
      summary: Get the authenticated admin user
      operationId: getAdminMe
      x-implementation-status: implemented
      responses:
        "200":
          description: The admin user bound to the current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
              example:
                id: 8f1f9f76-1f0a-4a2e-9a5e-2b8f4f1c9d10
                email: editor@example.com
                displayName: Content Editor
                role: VIEWER
                status: ACTIVE
                createdAt: 2026-08-23T10:00:00Z
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        default:
          $ref: ./openapi/components.yaml#/responses/ErrorResponse
components:
  parameters:
    AdminOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    DraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: The draft revision the editor read, for optimistic concurrency.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    AdminLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    DraftIfMatchRequired:
      description: The If-Match header with the draft revision is missing.
      content:
        application/json:
          schema:
            $ref: ./openapi/components.yaml#/schemas/ErrorEnvelope
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cf_admin_session
      description: >-
        Opaque, HttpOnly, server-side admin session cookie. The browser
        reaches the API same-origin through the console's `/api` reverse
        proxy; the cookie is never exposed to scripts or stored elsewhere.
  schemas:
    AdminGoogleLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 16
          maxLength: 4096
          description: Google ID token issued to the admin console's OAuth client.
    AdminRole:
      type: string
      description: >-
        Closed protocol enum (ADR-009): roles drive the console state
        machine, so adding one is a breaking change of the admin contract.
      enum: [VIEWER, EDITOR, PUBLISHER, ADMIN]
    AdminUserStatus:
      type: string
      description: >-
        Closed protocol enum (ADR-009). A disabled admin loses access
        immediately, including active sessions.
      enum: [ACTIVE, DISABLED]
    AdminUser:
      type: object
      required: [id, email, displayName, role, status, createdAt]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminUserStatus"
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          minimum: 0
    AdminUserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminUserStatus"
    AdminDraftStatus:
      type: string
      description: >-
        Closed protocol enum (ADR-009): the console's editorial state
        machine depends on these values.
      enum: [DRAFT, VALIDATING, READY, PROPOSED, MERGED, FAILED]
    AdminDraftSummary:
      type: object
      required:
        - id
        - baseContentVersion
        - baseCatalogCommit
        - schemaVersion
        - revision
        - status
        - proposalUrl
        - createdByAdminUserId
        - updatedByAdminUserId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        baseContentVersion:
          type: string
        baseCatalogCommit:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        proposalUrl:
          type: [string, "null"]
        createdByAdminUserId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        updatedByAdminUserId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        createdAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
        updatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminDraftList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftSummary"
        total:
          type: integer
          minimum: 0
    AdminDraftDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDraftSummary"
        - type: object
          required: [document, validationReport]
          properties:
            document:
              type: object
              description: >-
                The editorial catalog document, validated server-side
                against the versioned editorial-catalog JSON Schema.
            validationReport:
              type: [object, "null"]
    AdminDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
          description: >-
            Full replacement of the editorial document; must conform to the
            editorial-catalog JSON Schema or the request is refused.
    AdminDraftStamp:
      type: object
      required: [draftId, revision, status, updatedAt]
      properties:
        draftId:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        revision:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        updatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
    AdminDeckLocalizedText:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
    AdminDeckMembers:
      description: >-
        The three shapes the editorial model supports: the whole approved
        catalog, an explicit list of entity keys, or a taxonomy node whose
        descendants form the deck.
      oneOf:
        - type: string
          const: all-current
        - type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        - type: object
          additionalProperties: false
          required: [taxonomy]
          properties:
            taxonomy:
              type: string
              minLength: 1
              maxLength: 200
    AdminDraftDeck:
      type: object
      required: [key, kind, names, membersMode, members, memberCount]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        membersMode:
          type: string
          enum: [all-current, explicit, taxonomy]
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
        memberCount:
          type: integer
          minimum: 0
    AdminDraftDeckList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDraftDeck"
        total:
          type: integer
          minimum: 0
    AdminDraftDeckDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDraftDeck"
        - type: object
          required: [memberKeys]
          properties:
            memberKeys:
              type: array
              description: >-
                The entity keys the deck resolves to right now, sorted the
                way the release build sorts them.
              items:
                type: string
    AdminDraftDeckCreateRequest:
      type: object
      additionalProperties: false
      required: [key, kind, names, members]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
    AdminDraftDeckUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind:
          type: string
          enum: [curated, taxonomy]
        names:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/AdminDeckLocalizedText"
        members:
          $ref: "#/components/schemas/AdminDeckMembers"
    AdminValidationFinding:
      type: object
      required: [level, code, subject, message]
      properties:
        level:
          type: string
          enum: [blocking, warning]
        code:
          type: string
          minLength: 1
        subject:
          type: string
        message:
          type: string
    AdminValidationReport:
      type: object
      required: [validatedAt, blocking, warnings, findings]
      properties:
        validatedAt:
          $ref: ./openapi/components.yaml#/schemas/DateTime
        blocking:
          type: integer
          minimum: 0
        warnings:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            $ref: "#/components/schemas/AdminValidationFinding"
    AdminDraftValidationResult:
      type: object
      required: [status, revision, report]
      properties:
        status:
          $ref: "#/components/schemas/AdminDraftStatus"
        revision:
          type: integer
          minimum: 1
        report:
          $ref: "#/components/schemas/AdminValidationReport"
    AdminDeckDiffEntry:
      description: >-
        An editorial key and a published code are two namespaces, so an entry
        names both: a deck the draft adds has no published code yet, and one
        it drops has no editorial key any more. At least one is always
        present.
      type: object
      required: [deckKey, publishedCode, change, details]
      properties:
        deckKey:
          type: [string, "null"]
        publishedCode:
          type: [string, "null"]
        change:
          type: string
          enum: [added, removed, changed]
        details:
          type: array
          items:
            type: string
    AdminAssetDiffEntry:
      type: object
      required: [entityContentKey, assetType, change, reason]
      properties:
        entityContentKey:
          type: string
        assetType:
          type: string
          minLength: 1
          x-extensible-enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
        change:
          type: string
          enum: [added, replaced]
        reason:
          type: [string, "null"]
    AdminDraftDiff:
      type: object
      required: [baseContentVersion, isEmpty, decks, assets]
      properties:
        baseContentVersion:
          type: string
        isEmpty:
          type: boolean
          description: True when a release from this draft would change nothing.
        decks:
          type: array
          items:
            $ref: "#/components/schemas/AdminDeckDiffEntry"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AdminAssetDiffEntry"
    AdminContentStatus:
      type: object
      required:
        [activeVersion, schemaVersion, publishedAt, entityCount, deckCount]
      properties:
        activeVersion:
          type: [string, "null"]
        schemaVersion:
          type: [integer, "null"]
        publishedAt:
          type: [string, "null"]
          format: date-time
        entityCount:
          type: integer
          minimum: 0
        deckCount:
          type: integer
          minimum: 0
    AdminAssetRepresentation:
      type: object
      required: [url, mimeType, sha256, scale, widthPx, heightPx]
      properties:
        url:
          type: string
          format: uri
        mimeType:
          type: string
          minLength: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        scale:
          type: [integer, "null"]
        widthPx:
          type: [integer, "null"]
        heightPx:
          type: [integer, "null"]
    AdminAsset:
      type: object
      required:
        - id
        - type
        - variant
        - width
        - height
        - aspectRatio
        - licenseName
        - licenseUrl
        - attribution
        - source
        - representations
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        type:
          type: string
          minLength: 1
          x-extensible-enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
        variant:
          type: string
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        aspectRatio:
          type: [number, "null"]
        licenseName:
          type: string
        licenseUrl:
          type: [string, "null"]
        attribution:
          type: [string, "null"]
        source:
          type: object
          required: [name, url]
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
        representations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminAssetRepresentation"
    AdminEntityName:
      type: object
      required: [locale, nameType, value, isPrimary]
      properties:
        locale:
          $ref: ./openapi/components.yaml#/schemas/Locale
        nameType:
          type: string
          minLength: 1
          x-extensible-enum: [SHORT, OFFICIAL, COMMON, ALTERNATIVE]
        value:
          type: string
        isPrimary:
          type: boolean
    AdminEntitySummary:
      type: object
      required:
        - id
        - contentKey
        - slug
        - kind
        - status
        - recognitionStatus
        - isoAlpha2
        - isoAlpha3
        - nameRu
        - nameEn
        - flag
        - contentVersion
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        contentKey:
          type: string
        slug:
          type: string
        kind:
          type: string
          minLength: 1
          x-extensible-enum:
            [
              COUNTRY,
              TERRITORY,
              DEPENDENCY,
              DISPUTED_AREA,
              REGION,
              SUBREGION,
              OTHER,
            ]
        status:
          type: string
          enum: [ACTIVE, HISTORICAL, HIDDEN]
        recognitionStatus:
          type: string
          minLength: 1
          x-extensible-enum:
            - UN_MEMBER
            - UN_OBSERVER
            - PARTIALLY_RECOGNIZED
            - UNRECOGNIZED
            - DEPENDENT_TERRITORY
            - SPECIAL_AREA
            - NOT_APPLICABLE
        isoAlpha2:
          type: [string, "null"]
        isoAlpha3:
          type: [string, "null"]
        nameRu:
          type: [string, "null"]
        nameEn:
          type: [string, "null"]
        flag:
          anyOf:
            - $ref: "#/components/schemas/AdminAsset"
            - type: "null"
        contentVersion:
          type: string
    AdminEntityList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminEntitySummary"
        total:
          type: integer
          minimum: 0
    AdminEntityDetail:
      allOf:
        - $ref: "#/components/schemas/AdminEntitySummary"
        - type: object
          required: [names, assets, includeInCountryCatalog, validFrom, validTo]
          properties:
            names:
              type: array
              items:
                $ref: "#/components/schemas/AdminEntityName"
            assets:
              type: array
              items:
                $ref: "#/components/schemas/AdminAsset"
            includeInCountryCatalog:
              type: boolean
            validFrom:
              type: [string, "null"]
              format: date-time
            validTo:
              type: [string, "null"]
              format: date-time
    AdminDeckSummary:
      type: object
      required:
        [id, code, kind, status, cardCount, nameRu, nameEn, contentVersion]
      properties:
        id:
          $ref: ./openapi/components.yaml#/schemas/Uuid
        code:
          type: string
        kind:
          type: string
          minLength: 1
          x-extensible-enum: [CURATED, TAXONOMY, DYNAMIC_USER, CUSTOM]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, RETIRED]
        cardCount:
          type: integer
          minimum: 0
        nameRu:
          type: [string, "null"]
        nameEn:
          type: [string, "null"]
        contentVersion:
          type: string
    AdminDeckList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminDeckSummary"
        total:
          type: integer
          minimum: 0
    AdminDeckLocalization:
      type: object
      required: [locale, name, description]
      properties:
        locale:
          $ref: ./openapi/components.yaml#/schemas/Locale
        name:
          type: string
        description:
          type: string
    AdminDeckDetail:
      allOf:
        - $ref: "#/components/schemas/AdminDeckSummary"
        - type: object
          required: [localizations, ruleSpec]
          properties:
            localizations:
              type: array
              items:
                $ref: "#/components/schemas/AdminDeckLocalization"
            ruleSpec:
              type: [object, "null"]
security:
  - AdminSessionCookie: []
