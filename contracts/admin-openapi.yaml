    post:
      tags: [AdminReleases]
      summary: Give up on a queued run
      operationId: adminCancelReleaseRun
      x-implementation-status: implemented
      description: >-
        The way out of a queue nothing is draining. A run holds the only live
        slot, so one no executor picks up would block every release after it
        with the database as the only remedy.

        Only a queued run: a running one is a job that has already started,
        and cancelling the record under it would leave the two disagreeing
        about what happened.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The run, now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReleaseRun"
        "401":
          $ref: ./openapi/components.yaml#/responses/UnauthorizedResponse
        "403":
          description: >-
