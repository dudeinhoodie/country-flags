parameters:
  Platform:
    name: platform
    in: query
    required: true
    description: Client platform used for compatibility and flag evaluation.
    schema:
      type: string
      enum: [ios, android, web]
    example: ios
  AppVersion:
    name: appVersion
    in: query
    required: true
    description: Semantic application version.
    schema:
      type: string
      pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    example: 1.0.0
  Locale:
    name: locale
    in: query
    required: true
    description: Requested BCP 47 content locale.
    schema:
      $ref: "#/schemas/Locale"
    example: ru
  Cursor:
    name: cursor
    in: query
    required: false
    description: Opaque cursor returned by the previous page.
    schema:
      $ref: "#/schemas/OpaqueCursor"
  AfterCursor:
    name: after
    in: query
    required: true
    description: Opaque monotonic feed cursor; client timestamps are not accepted.
    schema:
      $ref: "#/schemas/OpaqueCursor"
  UserAfterCursor:
    name: after
    in: query
    required: false
    description: Opaque account-scoped cursor; omitted for the initial page.
    schema:
      $ref: "#/schemas/OpaqueCursor"
  Limit:
    name: limit
    in: query
    required: false
    description: Maximum number of records to return.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
  IfNoneMatch:
    name: If-None-Match
    in: header
    required: false
    description: Previously received entity tag.
    schema:
      type: string
      maxLength: 256
  IfMatch:
    name: If-Match
    in: header
    required: true
    description: Current integer resource version encoded as an entity tag.
    schema:
      type: string
      pattern: '^W\/"[0-9]+"$'
    example: W/"4"
  IdentityProvider:
    name: provider
    in: path
    required: true
    schema:
      $ref: "#/schemas/AuthProvider"
  DeviceId:
    name: deviceId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  MigrationId:
    name: migrationId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  ExportId:
    name: exportId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  EntityId:
    name: entityId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  DeckId:
    name: deckId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  SessionId:
    name: sessionId
    in: path
    required: true
    schema:
      $ref: "#/schemas/Uuid"
headers:
  ETag:
    description: Opaque version of the returned representation.
    schema:
      type: string
      maxLength: 256
  CacheControl:
    description: Cache lifetime for the returned snapshot.
    schema:
      type: string
      example: public, max-age=300
responses:
  ErrorResponse:
    description: Request failed with a typed error.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
  UnauthorizedResponse:
    description: Authentication or session proof is invalid.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
        example:
          error:
            code: UNAUTHORIZED
            message: Authentication is required
            requestId: 11bdc6ea-93e2-46e4-bd6c-5a14cec9f488
            details: {}
  NotFoundResponse:
    description: Requested resource does not exist in the authorized scope.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
        example:
          error:
            code: RESOURCE_NOT_FOUND
            message: The requested resource was not found
            requestId: 11bdc6ea-93e2-46e4-bd6c-5a14cec9f488
            details: {}
  ConflictResponse:
    description: Request conflicts with current state or idempotency history.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
        example:
          error:
            code: IDEMPOTENCY_CONFLICT
            message: The identifier was already used with another payload
            requestId: 11bdc6ea-93e2-46e4-bd6c-5a14cec9f488
            details: {}
  ValidationResponse:
    description: Payload violates the versioned request contract.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
        example:
          error:
            code: VALIDATION_FAILED
            message: One or more fields are invalid
            requestId: 11bdc6ea-93e2-46e4-bd6c-5a14cec9f488
            details:
              fields:
                - events[0].eventName
  PayloadTooLargeResponse:
    description: Request exceeds documented body or batch limits.
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
  RateLimitResponse:
    description: Request rate limit was exceeded.
    headers:
      Retry-After:
        description: Seconds until the client may retry.
        schema:
          type: integer
          minimum: 1
    content:
      application/json:
        schema:
          $ref: "#/schemas/ErrorEnvelope"
  AuthSessionResponse:
    description: Authenticated Country Flags session.
    content:
      application/json:
        schema:
          $ref: "#/schemas/AuthSession"
schemas:
  Uuid:
    type: string
    format: uuid
  DateTime:
    type: string
    format: date-time
  Locale:
    type: string
    pattern: ^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
  OpaqueCursor:
    type: string
    minLength: 1
    maxLength: 512
  AuthProvider:
    type: string
    enum: [APPLE, GOOGLE]
  AnswerMode:
    type: string
    enum: [SELF_RATED, MULTIPLE_CHOICE]
  Rating:
    type: string
    enum: [AGAIN, HARD, GOOD, EASY]
  ErrorEnvelope:
    type: object
    additionalProperties: false
    required: [error]
    properties:
      error:
        type: object
        additionalProperties: false
        required: [code, message, requestId, details]
        properties:
          code:
            type: string
            pattern: ^[A-Z][A-Z0-9_]*$
            maxLength: 128
          message:
            type: string
            minLength: 1
            maxLength: 500
          requestId:
            $ref: "#/schemas/Uuid"
          details:
            type: object
            additionalProperties: true
  HealthLive:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        type: string
        const: ok
  HealthReady:
    type: object
    additionalProperties: false
    required: [status, checks]
    properties:
      status:
        type: string
        enum: [ok, error]
      checks:
        type: object
        additionalProperties: false
        required: [database]
        properties:
          database:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status:
                type: string
                enum: [up, down]
              latencyMs:
                type: number
                minimum: 0
  DeviceRegistration:
    type: object
    additionalProperties: false
    required: [clientGeneratedId, platform, appVersion, locale, timezone]
    properties:
      clientGeneratedId:
        type: string
        minLength: 16
        maxLength: 128
      platform:
        type: string
        enum: [IOS, ANDROID, WEB]
      appVersion:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      locale:
        $ref: "#/schemas/Locale"
      timezone:
        type: string
        minLength: 1
        maxLength: 64
  AppleAuthRequest:
    type: object
    additionalProperties: false
    required: [identityToken, authorizationCode, rawNonce, device]
    properties:
      identityToken:
        type: string
        minLength: 32
        maxLength: 16384
        writeOnly: true
      authorizationCode:
        type: string
        minLength: 8
        maxLength: 4096
        writeOnly: true
      rawNonce:
        type: string
        minLength: 16
        maxLength: 256
        writeOnly: true
      device:
        $ref: "#/schemas/DeviceRegistration"
  GoogleAuthRequest:
    type: object
    additionalProperties: false
    required: [idToken, device]
    properties:
      idToken:
        type: string
        minLength: 32
        maxLength: 16384
        writeOnly: true
      device:
        $ref: "#/schemas/DeviceRegistration"
  AppleIdentityLinkRequest:
    type: object
    additionalProperties: false
    required: [identityToken, authorizationCode, rawNonce]
    properties:
      identityToken:
        type: string
        minLength: 32
        maxLength: 16384
        writeOnly: true
      authorizationCode:
        type: string
        minLength: 8
        maxLength: 4096
        writeOnly: true
      rawNonce:
        type: string
        minLength: 16
        maxLength: 256
        writeOnly: true
  GoogleIdentityLinkRequest:
    type: object
    additionalProperties: false
    required: [idToken]
    properties:
      idToken:
        type: string
        minLength: 32
        maxLength: 16384
        writeOnly: true
  RefreshRequest:
    type: object
    additionalProperties: false
    required: [refreshToken]
    properties:
      refreshToken:
        type: string
        minLength: 32
        maxLength: 4096
        writeOnly: true
  LogoutRequest:
    type: object
    additionalProperties: false
    properties:
      refreshToken:
        type: string
        minLength: 32
        maxLength: 4096
        writeOnly: true
  TokenPair:
    type: object
    additionalProperties: false
    required: [accessToken, refreshToken, accessTokenExpiresAt]
    properties:
      accessToken:
        type: string
        minLength: 32
        writeOnly: true
      refreshToken:
        type: string
        minLength: 32
        writeOnly: true
      accessTokenExpiresAt:
        $ref: "#/schemas/DateTime"
  ReauthenticationProof:
    type: object
    additionalProperties: false
    required: [reauthenticationToken, expiresAt]
    properties:
      reauthenticationToken:
        type: string
        minLength: 32
        maxLength: 4096
        writeOnly: true
      expiresAt:
        $ref: "#/schemas/DateTime"
  AuthSession:
    type: object
    additionalProperties: false
    required: [tokens, user, settings, serverTime]
    properties:
      tokens:
        $ref: "#/schemas/TokenPair"
      user:
        $ref: "#/schemas/User"
      settings:
        $ref: "#/schemas/UserSettings"
      serverTime:
        $ref: "#/schemas/DateTime"
  User:
    type: object
    additionalProperties: false
    required: [id, preferredLocale, status, createdAt, updatedAt]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      displayName:
        type: [string, "null"]
        minLength: 1
        maxLength: 100
      preferredLocale:
        $ref: "#/schemas/Locale"
      status:
        type: string
        enum: [ACTIVE, DELETION_PENDING, DELETED, BLOCKED]
      createdAt:
        $ref: "#/schemas/DateTime"
      updatedAt:
        $ref: "#/schemas/DateTime"
  UpdateUserRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      displayName:
        type: [string, "null"]
        minLength: 1
        maxLength: 100
      preferredLocale:
        $ref: "#/schemas/Locale"
  AuthIdentity:
    type: object
    additionalProperties: false
    required: [id, provider, createdAt, lastLoginAt]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      provider:
        $ref: "#/schemas/AuthProvider"
      createdAt:
        $ref: "#/schemas/DateTime"
      lastLoginAt:
        $ref: "#/schemas/DateTime"
  IdentityList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/AuthIdentity"
  Device:
    type: object
    additionalProperties: false
    required: [id, platform, appVersion, locale, timezone, lastSeenAt, current]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      platform:
        type: string
        enum: [IOS, ANDROID, WEB]
      appVersion:
        type: string
      locale:
        $ref: "#/schemas/Locale"
      timezone:
        type: string
      lastSeenAt:
        $ref: "#/schemas/DateTime"
      current:
        type: boolean
  DeviceList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Device"
  UserSettings:
    type: object
    additionalProperties: false
    required:
      - sessionSize
      - contentLocale
      - defaultAnswerMode
      - extraFactTypes
      - soundEnabled
      - hapticsEnabled
      - remindersEnabled
      - desiredRetention
      - timezone
      - version
      - updatedAt
    properties:
      sessionSize:
        type: integer
        enum: [5, 10, 20]
      contentLocale:
        $ref: "#/schemas/Locale"
      defaultAnswerMode:
        $ref: "#/schemas/AnswerMode"
      extraFactTypes:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [POPULATION, CAPITAL, AREA, LANGUAGE, CURRENCY]
      soundEnabled:
        type: boolean
      hapticsEnabled:
        type: boolean
      remindersEnabled:
        type: boolean
      reminderLocalTime:
        type: [string, "null"]
        pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      reminderWeekdays:
        type: [array, "null"]
        uniqueItems: true
        items:
          type: integer
          minimum: 1
          maximum: 7
      desiredRetention:
        type: number
        minimum: 0.7
        maximum: 0.99
      timezone:
        type: string
        minLength: 1
        maxLength: 64
      version:
        type: integer
        minimum: 1
      updatedAt:
        $ref: "#/schemas/DateTime"
  UpdateSettingsRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      sessionSize:
        type: integer
        enum: [5, 10, 20]
      contentLocale:
        $ref: "#/schemas/Locale"
      defaultAnswerMode:
        $ref: "#/schemas/AnswerMode"
      extraFactTypes:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [POPULATION, CAPITAL, AREA, LANGUAGE, CURRENCY]
      soundEnabled:
        type: boolean
      hapticsEnabled:
        type: boolean
      remindersEnabled:
        type: boolean
      reminderLocalTime:
        type: [string, "null"]
        pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      reminderWeekdays:
        type: [array, "null"]
        uniqueItems: true
        items:
          type: integer
          minimum: 1
          maximum: 7
      desiredRetention:
        type: number
        minimum: 0.7
        maximum: 0.99
      timezone:
        type: string
        minLength: 1
        maxLength: 64
  AccountDeletionResult:
    type: object
    additionalProperties: false
    required: [status, requestedAt, expectedCompletionAt]
    properties:
      status:
        type: string
        const: DELETION_PENDING
      requestedAt:
        $ref: "#/schemas/DateTime"
      expectedCompletionAt:
        $ref: "#/schemas/DateTime"
  DeleteProgressRequest:
    type: object
    additionalProperties: false
    required: [confirmation]
    properties:
      confirmation:
        type: string
        const: DELETE_PROGRESS
  ProgressDeletionResult:
    type: object
    additionalProperties: false
    required: [operationId, status, requestedAt]
    properties:
      operationId:
        $ref: "#/schemas/Uuid"
      status:
        type: string
        enum: [PENDING, COMPLETED]
      requestedAt:
        $ref: "#/schemas/DateTime"
  GuestImportResult:
    type: object
    additionalProperties: false
    required:
      - migrationId
      - status
      - acceptedEventCount
      - duplicateEventCount
      - rejectedEventCount
      - createdAt
    properties:
      migrationId:
        $ref: "#/schemas/Uuid"
      status:
        type: string
        enum: [PENDING, APPLIED, PARTIAL, FAILED]
      acceptedEventCount:
        type: integer
        minimum: 0
      duplicateEventCount:
        type: integer
        minimum: 0
      rejectedEventCount:
        type: integer
        minimum: 0
      createdAt:
        $ref: "#/schemas/DateTime"
      completedAt:
        type: [string, "null"]
        format: date-time
  DataExport:
    type: object
    additionalProperties: false
    required: [id, status, createdAt]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      status:
        type: string
        enum: [PENDING, PROCESSING, READY, EXPIRED, FAILED]
      downloadUrl:
        type: [string, "null"]
        format: uri
      sha256:
        type: [string, "null"]
        pattern: ^[a-f0-9]{64}$
      expiresAt:
        type: [string, "null"]
        format: date-time
      createdAt:
        $ref: "#/schemas/DateTime"
      completedAt:
        type: [string, "null"]
        format: date-time
  CursorPage:
    type: object
    additionalProperties: false
    required: [nextCursor, hasMore]
    properties:
      nextCursor:
        type: [string, "null"]
        minLength: 1
        maxLength: 512
      hasMore:
        type: boolean
  LocalizedName:
    type: object
    additionalProperties: false
    required: [short, aliases]
    properties:
      short:
        type: string
        minLength: 1
      official:
        type: [string, "null"]
        minLength: 1
      aliases:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
  Asset:
    type: object
    additionalProperties: false
    required: [id, type, url, mimeType, sha256, licenseName]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      type:
        type: string
        enum: [FLAG, COAT_OF_ARMS, MAP, OTHER]
      url:
        type: string
        format: uri
      mimeType:
        type: string
        enum: [image/svg+xml, image/png, image/webp]
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
      width:
        type: [integer, "null"]
        minimum: 1
      height:
        type: [integer, "null"]
        minimum: 1
      aspectRatio:
        type: [number, "null"]
        exclusiveMinimum: 0
      licenseName:
        type: string
        minLength: 1
      attribution:
        type: [string, "null"]
  Fact:
    type: object
    additionalProperties: false
    required: [type, displayValue, source]
    properties:
      type:
        type: string
        enum: [POPULATION, CAPITAL, AREA, LANGUAGE, CURRENCY, OTHER]
      displayValue:
        type: string
        minLength: 1
      observedAt:
        type: [string, "null"]
        format: date
      source:
        type: object
        additionalProperties: false
        required: [name, url]
        properties:
          name:
            type: string
          url:
            type: string
            format: uri
  GeoEntity:
    type: object
    additionalProperties: false
    required:
      - id
      - kind
      - status
      - recognitionStatus
      - name
      - assets
      - facts
      - contentVersion
    properties:
      id:
        $ref: "#/schemas/Uuid"
      kind:
        type: string
        enum:
          [
            COUNTRY,
            TERRITORY,
            DEPENDENCY,
            DISPUTED_AREA,
            REGION,
            SUBREGION,
            OTHER,
          ]
      status:
        type: string
        enum: [ACTIVE, HISTORICAL, HIDDEN]
      recognitionStatus:
        type: string
        enum:
          - UN_MEMBER
          - UN_OBSERVER
          - PARTIALLY_RECOGNIZED
          - UNRECOGNIZED
          - DEPENDENT_TERRITORY
          - SPECIAL_AREA
          - NOT_APPLICABLE
      name:
        $ref: "#/schemas/LocalizedName"
      assets:
        type: array
        items:
          $ref: "#/schemas/Asset"
      facts:
        type: array
        items:
          $ref: "#/schemas/Fact"
      contentVersion:
        type: string
  Deck:
    type: object
    additionalProperties: false
    required:
      - id
      - code
      - kind
      - name
      - description
      - cardCount
      - contentVersion
    properties:
      id:
        $ref: "#/schemas/Uuid"
      code:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      kind:
        type: string
        enum: [CURATED, TAXONOMY, DYNAMIC_USER, CUSTOM]
      name:
        type: string
        minLength: 1
      description:
        type: string
      cardCount:
        type: integer
        minimum: 0
      dueCount:
        type: [integer, "null"]
        minimum: 0
      currentMasteryTier:
        oneOf:
          - $ref: "#/schemas/MasteryTier"
          - type: "null"
      contentVersion:
        type: string
  DeckPage:
    type: object
    additionalProperties: false
    required: [items, page]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/Deck"
      page:
        $ref: "#/schemas/CursorPage"
  LearningCard:
    type: object
    additionalProperties: false
    required:
      - id
      - templateCode
      - templateSchemaVersion
      - semanticVersion
      - revision
      - answerMode
      - prompt
      - answer
      - contentVersion
    properties:
      id:
        $ref: "#/schemas/Uuid"
      templateCode:
        type: string
        pattern: ^[A-Z][A-Z0-9_]*$
      templateSchemaVersion:
        type: integer
        minimum: 1
      semanticVersion:
        type: integer
        minimum: 1
      revision:
        type: integer
        minimum: 1
      answerMode:
        $ref: "#/schemas/AnswerMode"
      prompt:
        type: object
        additionalProperties: false
        required: [asset]
        properties:
          asset:
            $ref: "#/schemas/Asset"
      answer:
        type: object
        additionalProperties: false
        required: [entityId, displayName, aliases]
        properties:
          entityId:
            $ref: "#/schemas/Uuid"
          displayName:
            type: string
            minLength: 1
          aliases:
            type: array
            items:
              type: string
      backSideFacts:
        type: array
        items:
          $ref: "#/schemas/Fact"
      contentVersion:
        type: string
  LearningCardPage:
    type: object
    additionalProperties: false
    required: [items, page]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/LearningCard"
      page:
        $ref: "#/schemas/CursorPage"
  ContentChangePage:
    type: object
    additionalProperties: false
    required: [items, nextCursor, hasMore, contentVersion]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/ContentChange"
      nextCursor:
        $ref: "#/schemas/OpaqueCursor"
      hasMore:
        type: boolean
      contentVersion:
        type: string
  ContentChange:
    type: object
    additionalProperties: false
    required: [operation, resourceType, resourceId, contentVersion]
    properties:
      operation:
        type: string
        enum: [UPSERT, RETIRE]
      resourceType:
        type: string
        enum: [ENTITY, DECK, LEARNING_CARD, ASSET, FACT]
      resourceId:
        $ref: "#/schemas/Uuid"
      contentVersion:
        type: string
  UserChangePage:
    type: object
    additionalProperties: false
    required: [items, nextCursor, hasMore]
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/UserChange"
      nextCursor:
        $ref: "#/schemas/OpaqueCursor"
      hasMore:
        type: boolean
  UserChange:
    type: object
    additionalProperties: false
    required: [operation, resourceType, resourceId, payload, occurredAt]
    properties:
      operation:
        type: string
        enum: [UPSERT, TOMBSTONE]
      resourceType:
        type: string
        enum: [CARD_STATE]
      resourceId:
        $ref: "#/schemas/Uuid"
      payload:
        oneOf:
          - $ref: "#/schemas/CardState"
          - type: "null"
      occurredAt:
        $ref: "#/schemas/DateTime"
  SelectionOrigin:
    type: string
    enum: [SERVER, CLIENT_OFFLINE]
  CreateStudySessionRequest:
    oneOf:
      - $ref: "#/schemas/CreateServerStudySessionRequest"
      - $ref: "#/schemas/CreateOfflineStudySessionRequest"
    discriminator:
      propertyName: selectionOrigin
      mapping:
        SERVER: "#/schemas/CreateServerStudySessionRequest"
        CLIENT_OFFLINE: "#/schemas/CreateOfflineStudySessionRequest"
  CreateServerStudySessionRequest:
    type: object
    additionalProperties: false
    required: [id, deckId, requestedUniqueCount, mode, locale, selectionOrigin]
    properties:
      id:
        $ref: "#/schemas/Uuid"
      deckId:
        $ref: "#/schemas/Uuid"
      requestedUniqueCount:
        type: integer
        enum: [5, 10, 20]
      mode:
        type: string
