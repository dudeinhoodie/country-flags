    delete:
      tags:
        - Account
      summary: Request complete account deletion
      operationId: deleteMe
      x-implementation-status: implemented
      description: A signed-in session is the gate; the client asks for an explicit confirmation before calling. The deletion stays a grace-period request rather than an immediate erasure, which is what makes the session alone acceptable proof.
      responses:
        '202':
          description: Deletion request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResult'
