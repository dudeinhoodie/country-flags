        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          $ref: '#/components/responses/ValidationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/changes:
    get:
      tags:
        - Progress
      summary: Get immutable user changes after an opaque cursor
      operationId: getUserChanges
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/UserAfterCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered page of account-scoped changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserChangePage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/due-summary:
    get:
      tags:
        - Progress
      summary: Get due counts grouped by learning state
      operationId: getDueSummary
      x-implementation-status: implemented
      responses:
        '200':
          description: Due summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/progress:
    get:
      tags:
        - Progress
      summary: Get aggregate account learning progress
      operationId: getProgress
      x-implementation-status: implemented
      responses:
        '200':
          description: Account progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummary'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Progress
      summary: Delete all learning progress but preserve the account
      description: Removes review history, card states, study sessions, achievements and deck mastery while keeping the account, identities, devices and settings. The account change stream is rotated, so cursors issued before the deletion stop resolving and every device performs a full progress resynchronization.
      operationId: deleteProgress
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProgressRequest'
      responses:
        '202':
          description: Progress deletion accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressDeletionResult'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '422':
          $ref: '#/components/responses/ValidationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/decks/{deckId}/progress:
    get:
      tags:
        - Progress
      summary: Get progress and mastery for one deck
      operationId: getDeckProgress
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DeckId'
      responses:
        '200':
          description: Deck progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckProgress'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
