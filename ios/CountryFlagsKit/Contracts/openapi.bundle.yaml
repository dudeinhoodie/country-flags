      type: object
      required:
        - id
        - position
        - displayName
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 0
          maximum: 3
        displayName:
          type: string
          minLength: 1
    OfflineStudySessionCard:
      type: object
      description: One card of an offline composition. The server resolves the card against the deck and the declared revision and rebuilds its snapshot; the submitted `snapshot` is only checked for identity agreement.
      additionalProperties: false
      required:
        - learningCardId
        - learningCardRevision
        - assetSha256
        - randomSeed
        - snapshot
      properties:
        learningCardId:
          $ref: '#/components/schemas/Uuid'
        learningCardRevision:
          type: integer
          minimum: 1
        assetSha256:
          description: Checksum of the prompt asset the client actually cached — whichever representation it chose for its screen, not necessarily the vector. It must match one of the encodings the declared revision publishes, otherwise the import is rejected with `422 OFFLINE_SESSION_COMPOSITION_INVALID`.
          type: string
          pattern: ^[a-f0-9]{64}$
        randomSeed:
          type: string
          minLength: 1
          maxLength: 128
        distractorPolicyVersion:
          description: Objective-mode only. Sending a non-null value is rejected with `422 OFFLINE_MODE_UNSUPPORTED`.
          type:
            - string
            - 'null'
        snapshot:
          description: Learning card the client rendered offline. Only `id` and `revision` are authoritative; the persisted snapshot is rebuilt server-side.
          $ref: '#/components/schemas/LearningCard'
        options:
          description: Objective-mode only. Sending options is rejected with `422 OFFLINE_MODE_UNSUPPORTED`.
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/StudyOption'
    CreateOfflineStudySessionRequest:
      type: object
      description: Import of a session assembled by a client without network access. Only `SELF_RATED` is importable; `MULTIPLE_CHOICE` is rejected with `422 OFFLINE_MODE_UNSUPPORTED`. `cards` must not exceed `requestedUniqueCount` and must not repeat a `learningCardId`.
      additionalProperties: false
      required:
        - id
        - deckId
        - requestedUniqueCount
        - mode
        - locale
        - selectionOrigin
        - startedAt
        - contentVersion
        - cards
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        deckId:
          $ref: '#/components/schemas/Uuid'
        requestedUniqueCount:
          type: integer
          enum:
            - 5
            - 10
            - 20
        mode:
          $ref: '#/components/schemas/AnswerMode'
        locale:
          $ref: '#/components/schemas/Locale'
        selectionOrigin:
          type: string
          const: CLIENT_OFFLINE
        startedAt:
          description: Instant the learner started the offline session. Preserved as the canonical session start unless the device clock runs further ahead than the tolerated skew, in which case the server receive time wins.
          $ref: '#/components/schemas/DateTime'
        contentVersion:
          description: Content release the offline composition was built from. A superseded release is accepted; an unknown or unpublished one is rejected with `422 CONTENT_VERSION_UNKNOWN`.
          type: string
        cards:
          description: Client selection order. Card `id`, `initialOrder`, `selectionReason` and the returned learning card snapshot are derived by the server.
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OfflineStudySessionCard'
    CreateStudySessionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateServerStudySessionRequest'
        - $ref: '#/components/schemas/CreateOfflineStudySessionRequest'
      discriminator:
        propertyName: selectionOrigin
        mapping:
          SERVER: '#/components/schemas/CreateServerStudySessionRequest'
          CLIENT_OFFLINE: '#/components/schemas/CreateOfflineStudySessionRequest'
    SelectionOrigin:
      type: string
      enum:
