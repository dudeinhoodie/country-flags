openapi: 3.1.0
info:
  title: Country Flags API
  version: 2.0.0
  summary: Canonical contract for Country Flags clients
  description: |
    Contract-first REST API for content, authentication, study sessions,
    progress synchronization, configuration and privacy-aware telemetry.
    Operations marked `planned` define the stable MVP contract before their
    NestJS implementation lands.

    ## Refusing a request

    A request this API will not act on because of what the request itself
    says — a parameter or field that is missing, unreadable, or outside its
    allowed values — is answered `422` with the code `VALIDATION_FAILED` and
    a `details.fields` entry naming what was wrong. This holds wherever the
    field arrived from: a query parameter and a body field are refused the
    same way, so a client can report or retry by status without knowing
    which endpoint it was talking to.

    `400` is not used. A well-formed request that is refused for what the
    system knows rather than for how it was written — an unknown content
    version, a session that cannot be composed — is also `422`, but carries
    a code of its own that names the reason.

    A cursor is the common case: one that cannot be read says so, and says
    that asking without it starts the list over. Clients hit this when they
    hold a cursor issued by a release that no longer exists.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.country-flags.app
    description: Production placeholder
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Process liveness and required dependency readiness.
  - name: Configuration
    description: Evaluated client configuration and compatibility policy.
  - name: Authentication
    description: Provider authentication and Country Flags token lifecycle.
  - name: Account
    description: Profile, identities, devices, privacy and account lifecycle.
  - name: Settings
    description: Versioned synchronized user preferences.
  - name: Content
    description: Immutable content manifests, cursors, entities and decks.
  - name: Study
    description: Reproducible sessions and immutable review ingestion.
  - name: Progress
    description: Due state, mastery, achievements and guest migration.
  - name: Analytics
    description: Allowlisted privacy-aware product and operational events.
  - name: Diagnostics
    description: Sanitized bounded platform diagnostics.
paths:
  /v1/health/live:
    get:
      tags:
        - Health
      summary: Check process liveness
      operationId: getHealthLive
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              example:
                status: ok
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/health/ready:
    get:
      tags:
        - Health
      summary: Check service readiness
      operationId: getHealthReady
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Service and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: ok
                checks:
                  database:
                    status: up
                    latencyMs: 4.2
        '503':
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: error
                checks:
                  database:
                    status: down
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/app-config:
    get:
      tags:
        - Configuration
      summary: Get evaluated application configuration
      operationId: getAppConfig
      x-implementation-status: implemented
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Evaluated, cacheable configuration snapshot
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app-config.v1.schema'
        '304':
          description: Cached configuration is still current
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/apple:
    post:
      tags:
        - Authentication
      summary: Authenticate with Sign in with Apple
      operationId: authenticateWithApple
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/google:
    post:
      tags:
        - Authentication
      summary: Authenticate with Google
      operationId: authenticateWithGoogle
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate a refresh token
      operationId: refreshSession
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/reauth/apple:
    post:
      tags:
        - Authentication
      summary: Create fresh account-operation proof with Apple
      operationId: reauthenticateApple
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleIdentityLinkRequest'
      responses:
        '200':
          description: Short-lived proof bound to the current backend session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthenticationProof'
        '401':
