          pattern: ^https://
        changeCursor:
          $ref: '#/components/schemas/cursor'
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/file'
        signature:
          $ref: '#/components/schemas/signature'
      $defs:
        locale:
          type: string
          pattern: ^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
        cursor:
          type: string
          minLength: 1
          maxLength: 512
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        file:
          type: object
          additionalProperties: false
          required:
            - path
            - bytes
            - sha256
            - schemaId
          properties:
            path:
              type: string
              pattern: ^[a-z0-9][a-z0-9._/-]*\.json$
            bytes:
              type: integer
              minimum: 1
            sha256:
              $ref: '#/components/schemas/sha256'
            schemaId:
              type: string
              format: uri
        signature:
          type: object
          additionalProperties: false
          required:
            - algorithm
            - keyId
            - value
          properties:
            algorithm:
              const: Ed25519
            keyId:
              type: string
              minLength: 1
              maxLength: 128
            value:
              type: string
              contentEncoding: base64
    OpaqueCursor:
      type: string
      minLength: 1
      maxLength: 512
    ContentChange:
      type: object
      required:
        - operation
