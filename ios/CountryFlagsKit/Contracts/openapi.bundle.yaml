  /v1/decks/{deckId}/cards:
    get:
      tags:
        - Content
      summary: List immutable card snapshots for a deck
      operationId: listDeckCards
      x-implementation-status: implemented
      security:
        - {}
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeckId'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of learning cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCardPage'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/study-sessions:
    post:
      tags:
        - Study
      summary: Create or idempotently import a study session
      description: |
        SERVER selection supports SELF_RATED and MULTIPLE_CHOICE. Objective
        sessions persist four versioned option snapshots and never expose the
        correct option before grading.

        CLIENT_OFFLINE imports a session a client already assembled without
        network access, so its reviews can be sent afterwards. The server
        preserves the client `id`, `startedAt`, `contentVersion` and card order,
        and rebuilds every card snapshot from the declared immutable learning
        card revision instead of trusting the submitted one.

        Both origins are idempotent on the session `id`: an identical request
        returns `200` with the stored snapshot, a different composition for the
        same `id` returns `409`. Idempotency is keyed on the normalized session
        composition, not on the byte-identical body.

        CLIENT_OFFLINE accepts SELF_RATED only. An offline `MULTIPLE_CHOICE`
        session (or any card carrying `options`/`distractorPolicyVersion`) is
        rejected with `422 OFFLINE_MODE_UNSUPPORTED`, because `StudyOption`
        carries no answer entity identity and correctness may never be derived
        from a localized display string.

        A `contentVersion` that is no longer active is accepted as long as the
        release exists; the session records the content the learner actually
        studied. An unknown or unpublished release is rejected with
        `422 CONTENT_VERSION_UNKNOWN`. A declared card that is not a member of
        the deck, has been retired, declares an unknown revision or a prompt
        asset checksum that no longer matches is rejected with
        `422 OFFLINE_SESSION_COMPOSITION_INVALID`; the import is atomic, so a
        rejected composition never leaves a partial session behind.
      operationId: createStudySession
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudySessionRequest'
      responses:
        '200':
          description: Existing idempotent study session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '201':
          description: Created study session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: Request validation failed (`VALIDATION_FAILED`), no card has three unique localized distractors (`DISTRACTOR_POOL_INSUFFICIENT`), the offline answer mode is not importable (`OFFLINE_MODE_UNSUPPORTED`), the declared content release does not exist (`CONTENT_VERSION_UNKNOWN`) or the declared offline composition is invalid (`OFFLINE_SESSION_COMPOSITION_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/study-sessions/{sessionId}:
    get:
      tags:
        - Study
      summary: Get a reproducible study session snapshot
      operationId: getStudySession
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Study session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/study-sessions/{sessionId}/complete:
    post:
      tags:
        - Study
      summary: Complete a study session idempotently
      description: The first accepted call fixes the canonical summary from the review events already ingested for the session; later retries return it unchanged. A client completion instant is bounded by the session start and the server receive time, so a skewed device clock cannot produce a negative or inflated duration.
      operationId: completeStudySession
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStudySessionRequest'
      responses:
        '200':
          description: Completed session with canonical summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySession'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          $ref: '#/components/responses/ValidationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/reviews/batch:
    post:
      tags:
        - Study
      summary: Ingest discriminated immutable review events
      operationId: createReviewBatch
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBatchRequest'
      responses:
        '200':
          description: Per-event canonical ingestion results
