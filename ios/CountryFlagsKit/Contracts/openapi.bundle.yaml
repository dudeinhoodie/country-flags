          type: string
    LocalizedName:
      type: object
      required:
        - short
        - aliases
      properties:
        short:
          type: string
          minLength: 1
        official:
          type:
            - string
            - 'null'
          minLength: 1
        aliases:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    AssetRepresentation:
      type: object
      required:
        - url
        - mimeType
        - sha256
      properties:
        url:
          type: string
          format: uri
        mimeType:
          type: string
          enum:
            - image/svg+xml
            - image/png
            - image/webp
        sha256:
          description: Checksum of the bytes this representation serves. It belongs to the representation rather than to the asset because a client verifies what it actually downloaded, and a checksum of the vector cannot vouch for a raster.
          type: string
          pattern: ^[a-f0-9]{64}$
        scale:
          description: Screen scale the raster was rendered for. Null for the vector original, which has no fixed scale.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 3
        widthPx:
          type:
            - integer
            - 'null'
          minimum: 1
        heightPx:
          type:
            - integer
            - 'null'
          minimum: 1
    Asset:
      type: object
      required:
        - id
        - type
        - representations
        - licenseName
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          minLength: 1
          x-extensible-enum:
            - FLAG
            - COAT_OF_ARMS
            - MAP
            - OTHER
        representations:
          description: |-
            Every published encoding of this asset, in the order a client should prefer them: the vector original first when one exists, then raster by ascending scale. An editorially supplied drawing may never have had a vector and publishes a single raster instead. A client picks the encoding that suits its screen and can fall back down the list, so an encoding it cannot render is inert rather than fatal.
            This is the only place an encoding is described. The asset used to carry the vector a second time, in its own `url`, `mimeType` and `sha256`, so that a client written before this field kept working; those are gone in v2 and this list is now required.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssetRepresentation'
        width:
          type:
            - integer
            - 'null'
          minimum: 1
        height:
          type:
            - integer
            - 'null'
          minimum: 1
        aspectRatio:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
        licenseName:
          type: string
          minLength: 1
        attribution:
          type:
            - string
            - 'null'
    CapitalFactDetails:
      type: object
      required:
        - kind
        - seats
      properties:
        kind:
          type: string
          enum:
            - capital
        seats:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 1
              role:
                type:
                  - string
                  - 'null'
                description: What kind of seat this is when the source says so — an official capital, a legislative one. Null when it does not.
    CurrencyFactDetails:
      type: object
      required:
        - kind
        - tenders
      properties:
        kind:
          type: string
          enum:
            - currency
        tenders:
          type: array
          items:
            type: object
            required:
              - code
              - name
            properties:
              code:
                description: The ISO 4217 code, which is what is printed on the note.
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              role:
                type:
                  - string
                  - 'null'
    LanguageFactDetails:
      type: object
      required:
        - kind
        - languages
      properties:
        kind:
          type: string
          enum:
            - language
        languages:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              code:
                description: The BCP 47 tag, when the release carries one. A language the backend could name without a tag has none.
                type:
                  - string
                  - 'null'
              name:
                type: string
                minLength: 1
    PopulationFactDetails:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - population
        value:
          description: The count itself, unformatted — grouping is the screen's.
          type: integer
          minimum: 0
        year:
          description: The year the source counted, not the day it published.
          type:
            - integer
            - 'null'
    Fact:
      type: object
      required:
        - type
        - displayValue
        - source
      properties:
        type:
          type: string
          minLength: 1
          x-extensible-enum:
            - POPULATION
            - CAPITAL
            - AREA
            - LANGUAGE
            - CURRENCY
            - OTHER
        displayValue:
          description: 'The fact as one line, composed by the backend in the requested locale. Kept for clients that predate `details`, and for a fact whose shape no rule here models. A client that understands `details` should present that instead: this string bakes in decisions — which separator, whether a currency shows its code — that belong to the screen.'
          type: string
          minLength: 1
        details:
          description: The same fact with its parts still apart, names already resolved to the requested locale. Absent when the stored value has a shape the backend does not model, in which case `displayValue` is all there is.
          oneOf:
            - $ref: '#/components/schemas/CapitalFactDetails'
            - $ref: '#/components/schemas/CurrencyFactDetails'
            - $ref: '#/components/schemas/LanguageFactDetails'
            - $ref: '#/components/schemas/PopulationFactDetails'
          discriminator:
            propertyName: kind
            mapping:
              capital: '#/components/schemas/CapitalFactDetails'
              currency: '#/components/schemas/CurrencyFactDetails'
              language: '#/components/schemas/LanguageFactDetails'
              population: '#/components/schemas/PopulationFactDetails'
        observedAt:
          type:
            - string
            - 'null'
          format: date
        source:
          type: object
          required:
            - name
            - url
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
    GeoEntity:
      type: object
      required:
        - id
        - kind
        - status
        - recognitionStatus
        - name
        - assets
        - facts
        - contentVersion
      properties:
