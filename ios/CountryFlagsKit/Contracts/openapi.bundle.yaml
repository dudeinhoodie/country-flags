        - contentVersion
      properties:
        operation:
          type: string
          enum:
            - UPSERT
            - RETIRE
        resourceType:
          type: string
          minLength: 1
          x-extensible-enum:
            - ENTITY
            - DECK
            - LEARNING_CARD
            - ASSET
            - FACT
        resourceId:
          $ref: '#/components/schemas/Uuid'
        contentVersion:
          type: string
    ContentChangePage:
