      description: Payload violates the versioned request contract.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields are invalid
              requestId: 11bdc6ea-93e2-46e4-bd6c-5a14cec9f488
              details:
                fields:
                  - events[0].eventName
    PayloadTooLargeResponse:
      description: Request exceeds documented body or batch limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitResponse:
      description: Request rate limit was exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    Platform:
      name: platform
      in: query
      required: true
      description: Client platform used for compatibility and flag evaluation.
      schema:
        type: string
        enum:
          - ios
          - android
          - web
      example: ios
    AppVersion:
      name: appVersion
      in: query
      required: true
      description: Semantic application version.
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
      example: 1.0.0
    Locale:
      name: locale
      in: query
      required: true
      description: Requested BCP 47 content locale.
      schema:
        $ref: '#/components/schemas/Locale'
      example: ru
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Previously received entity tag.
      schema:
        type: string
        maxLength: 256
    IdentityProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthProvider'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current integer resource version encoded as an entity tag.
      schema:
        type: string
        pattern: ^W\/"[0-9]+"$
      example: W/"4"
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AfterCursor:
      name: after
      in: query
      required: true
      description: Opaque monotonic feed cursor; client timestamps are not accepted.
      schema:
        $ref: '#/components/schemas/OpaqueCursor'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        $ref: '#/components/schemas/OpaqueCursor'
    DeckId:
      name: deckId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserAfterCursor:
      name: after
      in: query
      required: false
      description: Opaque account-scoped cursor; omitted for the initial page.
      schema:
        $ref: '#/components/schemas/OpaqueCursor'
  headers:
    ETag:
      description: Opaque version of the returned representation.
      schema:
        type: string
        maxLength: 256
    CacheControl:
      description: Cache lifetime for the returned snapshot.
      schema:
        type: string
        example: public, max-age=300
