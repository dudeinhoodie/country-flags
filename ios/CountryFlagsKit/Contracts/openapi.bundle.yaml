        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - Account
      summary: Update the current user profile
      operationId: updateMe
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated profile
          content:
