  /v1/me/achievements:
    get:
      tags:
        - Progress
      summary: List earned achievements
      operationId: listAchievements
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor page of achievements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/analytics/events/batch:
    post:
      tags:
        - Analytics
      summary: Ingest allowlisted analytics events
      operationId: createAnalyticsBatch
      x-implementation-status: implemented
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batch.v1.schema'
      responses:
        '200':
          description: Per-event ingestion results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestionResult'
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/diagnostics/metrickit:
    post:
      tags:
        - Diagnostics
      summary: Upload a sanitized MetricKit report
      operationId: createMetricKitReport
      x-implementation-status: implemented
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricKitReport'
      responses:
        '202':
          description: Sanitized report accepted
        '413':
          $ref: '#/components/responses/PayloadTooLargeResponse'
        '422':
          $ref: '#/components/responses/ValidationResponse'
        '429':
          $ref: '#/components/responses/RateLimitResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/privacy-settings:
    get:
      tags:
        - Account
      summary: Get analytics and diagnostics consent settings
      operationId: getPrivacySettings
      x-implementation-status: implemented
      responses:
        '200':
          description: Privacy settings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - Account
      summary: Update privacy consent settings with optimistic concurrency
      operationId: updatePrivacySettings
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivacySettingsRequest'
      responses:
        '200':
          description: Updated privacy settings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Country Flags access token.
    ReauthenticationToken:
      type: apiKey
      in: header
      name: X-Reauthentication-Token
      description: Short-lived proof of fresh provider reauthentication.
  schemas:
    Uuid:
      type: string
      format: uuid
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
            - details
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
              maxLength: 128
            message:
              type: string
              minLength: 1
              maxLength: 500
            requestId:
              $ref: '#/components/schemas/Uuid'
            details:
              type: object
              additionalProperties: true
    HealthLive:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    HealthReady:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - up
                    - down
                latencyMs:
                  type: number
                  minimum: 0
    Locale:
      type: string
      pattern: ^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
    booleanFlag:
      type: object
      additionalProperties: false
      required:
        - type
        - value
        - variant
        - activationPolicy
      properties:
        type:
          const: boolean
        value:
          type: boolean
        variant:
          type: string
          minLength: 1
          maxLength: 128
        activationPolicy:
          enum:
            - immediate
            - nextSession
            - nextLaunch
    stringFlag:
      type: object
      additionalProperties: false
      required:
        - type
        - value
        - variant
        - activationPolicy
      properties:
        type:
          const: string
        value:
          type: string
          maxLength: 256
        variant:
          type: string
          minLength: 1
          maxLength: 128
        activationPolicy:
          enum:
            - immediate
            - nextSession
            - nextLaunch
    numberFlag:
      type: object
      additionalProperties: false
      required:
        - type
        - value
        - variant
        - activationPolicy
      properties:
        type:
          const: number
        value:
          type: number
        variant:
          type: string
          minLength: 1
          maxLength: 128
        activationPolicy:
          enum:
            - immediate
            - nextSession
            - nextLaunch
    placementPolicy:
      type: object
      additionalProperties: false
      required:
        - enabled
        - format
      properties:
        enabled:
          type: boolean
        format:
          enum:
            - BANNER
            - NATIVE
            - INTERSTITIAL
            - REWARDED
    clientVersionPolicy:
      type: object
      additionalProperties: false
      required:
        - minimumSupported
        - latest
      properties:
        minimumSupported:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        latest:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        updateMode:
          enum:
            - NONE
            - SOFT
            - FORCED
    evaluatedFlag:
      oneOf:
        - $ref: '#/components/schemas/booleanFlag'
        - $ref: '#/components/schemas/stringFlag'
        - $ref: '#/components/schemas/numberFlag'
    advertisingPolicy:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - enabled
        - mode
        - placements
        - refreshAfter
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        mode:
          enum:
            - DISABLED
            - CONTEXTUAL_ONLY
        placements:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
          additionalProperties:
            $ref: '#/components/schemas/placementPolicy'
        refreshAfter:
          type: string
          format: date-time
    app-config.v1.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://country-flags.app/contracts/configuration/v1/app-config.schema.json
      title: App configuration snapshot v1
      type: object
      additionalProperties: false
      required:
        - configVersion
        - generatedAt
        - expiresAt
        - minimumClientVersions
        - contentVersion
        - supportedTemplateSchemaVersions
        - featureFlags
        - advertising
      properties:
        $schema:
          type: string
        configVersion:
          type: string
          minLength: 1
          maxLength: 128
        generatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        minimumClientVersions:
          type: object
          additionalProperties: false
          required:
            - ios
          properties:
            ios:
              $ref: '#/components/schemas/clientVersionPolicy'
            android:
              $ref: '#/components/schemas/clientVersionPolicy'
            web:
              $ref: '#/components/schemas/clientVersionPolicy'
        contentVersion:
          type: string
          minLength: 1
          maxLength: 128
        supportedTemplateSchemaVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        featureFlags:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*){1,}$
          additionalProperties:
            $ref: '#/components/schemas/evaluatedFlag'
        advertising:
          $ref: '#/components/schemas/advertisingPolicy'
      $defs:
        clientVersionPolicy:
          type: object
          additionalProperties: false
          required:
            - minimumSupported
            - latest
          properties:
            minimumSupported:
              type: string
              pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
            latest:
              type: string
              pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
            updateMode:
              enum:
                - NONE
                - SOFT
                - FORCED
        evaluatedFlag:
          oneOf:
            - $ref: '#/components/schemas/booleanFlag'
            - $ref: '#/components/schemas/stringFlag'
            - $ref: '#/components/schemas/numberFlag'
        booleanFlag:
          type: object
          additionalProperties: false
          required:
            - type
            - value
            - variant
            - activationPolicy
          properties:
            type:
              const: boolean
            value:
              type: boolean
            variant:
              type: string
              minLength: 1
              maxLength: 128
            activationPolicy:
              enum:
                - immediate
                - nextSession
                - nextLaunch
        stringFlag:
          type: object
          additionalProperties: false
          required:
            - type
            - value
            - variant
            - activationPolicy
          properties:
            type:
              const: string
            value:
              type: string
              maxLength: 256
            variant:
              type: string
              minLength: 1
              maxLength: 128
            activationPolicy:
              enum:
                - immediate
                - nextSession
                - nextLaunch
        numberFlag:
          type: object
          additionalProperties: false
          required:
            - type
            - value
            - variant
            - activationPolicy
          properties:
            type:
              const: number
            value:
              type: number
            variant:
              type: string
              minLength: 1
              maxLength: 128
            activationPolicy:
              enum:
                - immediate
                - nextSession
                - nextLaunch
        advertisingPolicy:
          type: object
          additionalProperties: false
          required:
            - policyVersion
            - enabled
            - mode
            - placements
            - refreshAfter
          properties:
            policyVersion:
              type: string
              minLength: 1
              maxLength: 128
            enabled:
              type: boolean
            mode:
              enum:
                - DISABLED
                - CONTEXTUAL_ONLY
            placements:
              type: object
              propertyNames:
                pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
              additionalProperties:
                $ref: '#/components/schemas/placementPolicy'
            refreshAfter:
              type: string
              format: date-time
        placementPolicy:
          type: object
          additionalProperties: false
          required:
            - enabled
            - format
          properties:
            enabled:
              type: boolean
            format:
              enum:
                - BANNER
                - NATIVE
                - INTERSTITIAL
                - REWARDED
    DeviceRegistration:
      type: object
      additionalProperties: false
      required:
        - clientGeneratedId
        - platform
        - appVersion
        - locale
        - timezone
      properties:
        clientGeneratedId:
          type: string
          minLength: 16
          maxLength: 128
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        appVersion:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    AppleAuthRequest:
      type: object
      additionalProperties: false
      required:
        - identityToken
        - authorizationCode
        - rawNonce
        - device
      properties:
        identityToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
        authorizationCode:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        rawNonce:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    DateTime:
      type: string
      format: date-time
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
      properties:
        accessToken:
          type: string
          minLength: 32
          writeOnly: true
        refreshToken:
          type: string
          minLength: 32
          writeOnly: true
        accessTokenExpiresAt:
          $ref: '#/components/schemas/DateTime'
    User:
      type: object
      required:
        - id
        - preferredLocale
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
        preferredLocale:
          $ref: '#/components/schemas/Locale'
        status:
          type: string
          enum:
            - ACTIVE
            - DELETION_PENDING
            - DELETED
            - BLOCKED
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    AnswerMode:
      type: string
      enum:
        - SELF_RATED
        - MULTIPLE_CHOICE
    UserSettings:
      type: object
      required:
        - sessionSize
        - contentLocale
        - defaultAnswerMode
        - extraFactTypes
        - soundEnabled
        - hapticsEnabled
        - remindersEnabled
        - desiredRetention
        - timezone
        - version
        - updatedAt
      properties:
        sessionSize:
          type: integer
          enum:
            - 5
            - 10
            - 20
        contentLocale:
          $ref: '#/components/schemas/Locale'
        defaultAnswerMode:
          $ref: '#/components/schemas/AnswerMode'
        extraFactTypes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            x-extensible-enum:
              - POPULATION
              - CAPITAL
              - AREA
              - LANGUAGE
              - CURRENCY
        soundEnabled:
          type: boolean
        hapticsEnabled:
          type: boolean
        remindersEnabled:
          type: boolean
        reminderLocalTime:
          type:
            - string
            - 'null'
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        reminderWeekdays:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        desiredRetention:
          type: number
          minimum: 0.7
          maximum: 0.99
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    AuthSession:
      type: object
      required:
        - tokens
        - user
        - settings
        - serverTime
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'
        settings:
          $ref: '#/components/schemas/UserSettings'
        serverTime:
          $ref: '#/components/schemas/DateTime'
    GoogleAuthRequest:
      type: object
      additionalProperties: false
      required:
        - idToken
        - device
      properties:
        idToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
    AppleIdentityLinkRequest:
      type: object
      additionalProperties: false
      required:
        - identityToken
        - authorizationCode
        - rawNonce
      properties:
        identityToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
        authorizationCode:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        rawNonce:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
    ReauthenticationProof:
      type: object
      required:
        - reauthenticationToken
        - expiresAt
      properties:
        reauthenticationToken:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
        expiresAt:
          $ref: '#/components/schemas/DateTime'
    GoogleIdentityLinkRequest:
      type: object
      additionalProperties: false
      required:
        - idToken
      properties:
        idToken:
          type: string
          minLength: 32
          maxLength: 16384
          writeOnly: true
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
    AccountDeletionResult:
      type: object
      required:
        - status
        - requestedAt
        - expectedCompletionAt
      properties:
        status:
          type: string
          const: DELETION_PENDING
        requestedAt:
          $ref: '#/components/schemas/DateTime'
        expectedCompletionAt:
          $ref: '#/components/schemas/DateTime'
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
        preferredLocale:
          $ref: '#/components/schemas/Locale'
    AuthProvider:
      type: string
      enum:
        - APPLE
        - GOOGLE
    AuthIdentity:
      type: object
      required:
        - id
        - provider
        - createdAt
        - lastLoginAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        provider:
          $ref: '#/components/schemas/AuthProvider'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastLoginAt:
          $ref: '#/components/schemas/DateTime'
    IdentityList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthIdentity'
    Device:
      type: object
      required:
        - id
        - platform
        - appVersion
        - locale
        - timezone
        - lastSeenAt
        - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        appVersion:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          type: string
        lastSeenAt:
          $ref: '#/components/schemas/DateTime'
        current:
          type: boolean
    DeviceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sessionSize:
          type: integer
          enum:
            - 5
            - 10
            - 20
        contentLocale:
          $ref: '#/components/schemas/Locale'
        defaultAnswerMode:
          $ref: '#/components/schemas/AnswerMode'
        extraFactTypes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - POPULATION
              - CAPITAL
              - AREA
              - LANGUAGE
              - CURRENCY
        soundEnabled:
          type: boolean
        hapticsEnabled:
          type: boolean
        remindersEnabled:
          type: boolean
        reminderLocalTime:
          type:
            - string
            - 'null'
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        reminderWeekdays:
          type:
            - array
            - 'null'
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        desiredRetention:
          type: number
          minimum: 0.7
          maximum: 0.99
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    selfRatedReview:
      type: object
      additionalProperties: false
      required:
        - id
        - sessionId
        - learningCardId
        - answerMode
        - rating
        - clientOccurredAt
        - clientSequence
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        learningCardId:
          type: string
          format: uuid
