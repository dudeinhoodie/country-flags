    CreateServerStudySessionRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - deckId
        - requestedUniqueCount
        - mode
        - locale
        - selectionOrigin
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        deckId:
          $ref: '#/components/schemas/Uuid'
        requestedUniqueCount:
          type: integer
          enum:
            - 5
            - 10
            - 20
        mode:
          type: string
          enum:
            - SELF_RATED
            - MULTIPLE_CHOICE
        locale:
          $ref: '#/components/schemas/Locale'
        selectionOrigin:
          type: string
          const: SERVER
        composition:
          type: string
          enum:
            - STANDARD
            - DUE_ONLY
          default: STANDARD
          description: 'STANDARD fills the session to requestedUniqueCount — due cards first, then new, then maintenance. DUE_ONLY selects only cards whose schedule has come round, capped at requestedUniqueCount: the session may hold fewer cards than requested, and holds none when nothing is due.'
